<script>
function notify(message){
  const text=String(message??'');
  let type='info', title='Notice', icon='i';
  if(/successfully|saved|created|updated|imported|processed successfully|completed/i.test(text)){type='success';title='Done';icon='✓';}
  if(/could not|failed|error|invalid|required|not found|access required|insufficient|exceeds|duplicate|cannot|must be|please /i.test(text)){type='error';title='Please check';icon='!';}
  const stack=document.getElementById('notifyStack');
  if(!stack){return;}
  const el=document.createElement('div');
  el.className='app-notify '+type;
  el.innerHTML='<div class="nicon">'+icon+'</div><div class="nbody"><div class="ntitle">'+title+'</div><div class="nmsg"></div></div><button class="nclose" aria-label="Close">×</button>';
  el.querySelector('.nmsg').textContent=text;
  el.querySelector('.nclose').onclick=()=>dismiss();
  stack.appendChild(el);
  const timer=setTimeout(dismiss, type==='error'?7000:4500);
  function dismiss(){
    clearTimeout(timer);
    if(!el.isConnected)return;
    el.style.animation='notifyOut .18s ease-in forwards';
    setTimeout(()=>el.remove(),180);
  }
}
</script>

function dealerReturnCredit(id){let credit=0;const trips=db.trips||[];for(const t of trips){for(const r of (t.returns||[])){const b=db.bills.find(x=>String(x.dbId)===String(r.invoiceId)||String(x.invoice)===String(r.invoice));if(!b||String(b.dealerId)!==String(id))continue;const o=db.orders.find(x=>String(x.dbId)===String(b.orderId));const it=(o?.items||[]).find(z=>String(z.productId)===String(r.productId)||String(z.sku)===String(r.sku||r.productSku));credit+=Number(r.qty||0)*Number(it?.price||0)}}return credit}
function balance(id){let b=Number((db.dealers.find(d=>d.id===id)||{}).opening||0);db.bills.filter(x=>x.dealerId===id).forEach(x=>b+=Number(x.amount||0));db.payments.filter(x=>x.dealerId===id).forEach(x=>b-=Number(x.amount||0));b-=dealerReturnCredit(id);return b}

function productRows(arr){return arr.map((p,i)=>`<tr data-search="${esc((p.sku+' '+p.modelNo+' '+p.brand+' '+p.name+' '+p.category).toLowerCase())}" data-brand="${esc(p.brand)}" data-category="${esc(p.category)}" data-stock="${p.stock}"><td class="cell">${esc(p.sku)}</td><td class="cell">${esc(p.modelNo||'')}</td><td class="cell">${esc(p.brand)}</td><td class="cell">${esc(p.name)}</td><td class="cell">${esc(p.category)}</td><td class="cell">${p.stock}</td><td class="cell">${money(p.price)}</td><td class="cell">${money(p.retailPrice)}</td><td class="table-actions"><button class="btn small secondary" onclick="editProduct(${i})">Edit</button><button class="btn small red" onclick="deleteProductCloud(${i})">Delete</button></td></tr>`)}
function filterProducts(q){q=String(q||'').toLowerCase();applyProductFilters(q)}
function applyProductFilters(q){q=String(q||'').toLowerCase();const brand=(document.getElementById('pf_brand_filter')||{}).value||'all',cat=(document.getElementById('pf_category_filter')||{}).value||'all',stock=(document.getElementById('pf_stock_filter')||{}).value||'all';document.querySelectorAll('#productBody tr').forEach(r=>{const text=(r.dataset.search||'');const b=(r.dataset.brand||'').toLowerCase(),c=(r.dataset.category||'').toLowerCase(),st=Number(r.dataset.stock||0);let ok=text.includes(q)&& (brand==='all'||b===brand.toLowerCase())&&(cat==='all'||c===cat.toLowerCase());if(stock==='low')ok=ok&&st<=3;if(stock==='available')ok=ok&&st>0;if(stock==='out')ok=ok&&st<=0;r.style.display=ok?'':'none'})}
function productFilterOptions(){const brands=[...new Set(db.products.map(p=>p.brand).filter(Boolean))].sort(),cats=[...new Set(db.products.map(p=>p.category).filter(Boolean))].sort();return `<select id="pf_brand_filter" class="filter" onchange="applyProductFilters(document.querySelector('#products .search input')?.value||'')"><option value="all">All Brands</option>${brands.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select><select id="pf_category_filter" class="filter" onchange="applyProductFilters(document.querySelector('#products .search input')?.value||'')"><option value="all">All Categories</option>${cats.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select><select id="pf_stock_filter" class="filter" onchange="applyProductFilters(document.querySelector('#products .search input')?.value||'')"><option value="all">All Stock</option><option value="available">In Stock</option><option value="low">Low Stock ≤ 3</option><option value="out">Out of Stock</option></select>`}
function productDatalist(id){const vals=[...new Set(db.products.flatMap(p=>[p.name,p.modelNo,p.sku]).filter(Boolean))];return `<datalist id="${id}">${vals.map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`}
function masterPicker(field,selected){
 const source=field==='brand'?(db.brands||[]).filter(x=>x.active!==false):(db.categories||[]).filter(x=>x.active!==false);
 const id=field==='brand'?'pf_brand':'pf_category';
 const label=field==='brand'?'Brand':'Category';
 const values=[...new Set(source.map(x=>x.name).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)));
 return `<div class="field"><label>${label}</label><input id="${id}" value="${esc(selected||'')}" autocomplete="off" placeholder="Type to search ${label.toLowerCase()}..." onfocus="filterMasterPicker('${field}',this.value)" oninput="filterMasterPicker('${field}',this.value)"><div id="${id}_list" class="autocomplete-list hidden"></div></div>`;
}
function filterMasterPicker(field,q){
 const id=field==='brand'?'pf_brand':'pf_category'; const list=document.getElementById(id+'_list'); if(!list)return;
 const source=field==='brand'?(db.brands||[]).filter(x=>x.active!==false):(db.categories||[]).filter(x=>x.active!==false);
 const s=String(q||'').trim().toLowerCase(); const vals=[...new Set(source.map(x=>x.name).filter(Boolean))].filter(v=>!s||String(v).toLowerCase().includes(s)).sort((a,b)=>String(a).localeCompare(String(b)));
 list.innerHTML=vals.length?vals.map(v=>`<div class="autocomplete-item" onclick="chooseMasterPicker('${field}',decodeURIComponent('${encodeURIComponent(String(v))}'))"><b>${esc(v)}</b><span>Select</span></div>`).join(''):`<div class="autocomplete-item"><span>No matching ${field} found</span></div>`;
 list.classList.remove('hidden');
}
function chooseMasterPicker(field,value){const id=field==='brand'?'pf_brand':'pf_category';const input=document.getElementById(id);const list=document.getElementById(id+'_list');if(input)input.value=value;if(list)list.classList.add('hidden');}
function brandOptions(selected=''){return masterPicker('brand',selected)}
function categoryOptions(selected=''){return masterPicker('category',selected)}

function productSuggestions(q){q=String(q||'').trim().toLowerCase();if(!q)return '';const hits=db.products.filter(p=>[p.sku,p.modelNo,p.name,p.brand,p.category].some(v=>String(v||'').toLowerCase().includes(q))).slice(0,8);return hits.length?`<div class="suggestions">${hits.map(p=>`<div class="suggestion" onclick="useProductSuggestion('${esc(p.dbId||p.sku)}')"><b>${esc(p.name)}</b><span>${esc(p.modelNo||p.sku)} · ${esc(p.brand)}</span></div>`).join('')}</div>`:''}
function useProductSuggestion(key){const p=db.products.find(x=String(x.dbId||x.sku)===String(key));if(!p)return;const m=document.getElementById('productSuggestionBox');if(m)m.innerHTML=`<div class="notice">Existing product found: <b>${esc(p.name)}</b> · ${esc(p.modelNo||p.sku)} · ${esc(p.brand)}. Use Edit Product instead of creating a duplicate.</div>`}
function productLookupText(p){return `${p.modelNo||''}${p.modelNo&&p.name?' — ':''}${p.name||''}`.trim()||p.sku}
function productLookupParts(v){
 const raw=String(v||'').trim();
 const parts=raw.split(/\s+[—–-]\s+/);
 if(parts.length>=2)return {modelNo:parts[0].trim(),name:parts.slice(1).join(' — ').trim()};
 const exact=db.products.find(p=>productLookupText(p).toLowerCase()===raw.toLowerCase());
 if(exact)return {modelNo:exact.modelNo||'',name:exact.name||''};
 return {modelNo:'',name:raw};
}

function showProductDupes(q){

 if(!s){box.innerHTML='';box.classList.add('hidden');return;}

 box.innerHTML=hits.length?hits.map(p=>`<div class="autocomplete-item" onclick="selectExistingProduct('${encodeURIComponent(String(p.dbId||p.sku))}')"><b>${esc(productLookupText(p))}</b><span>${esc(p.brand)} · ${esc(p.category)} · ${esc(p.sku)}</span></div>`).join(''):`<div class="autocomplete-item"><span>No existing product matches</span></div>`;
 box.classList.remove('hidden');
}
function selectExistingProduct(key){

async function saveProductForm(){
 const lookup=document.getElementById('pf_product_lookup').value.trim(),parts=productLookupParts(lookup);
 const p={sku:document.getElementById('pf_sku').value,modelNo:parts.modelNo,brand:document.getElementById('pf_brand').value.trim(),name:parts.name,category:document.getElementById('pf_category').value.trim(),stock:+document.getElementById('pf_stock').value||0,price:+document.getElementById('pf_price').value||0,retailPrice:+document.getElementById('pf_retail').value||0,active:true};
 if(!p.name)return notify('Product / Model is required.');
 const dup=db.products.find(x=>(p.modelNo&&x.modelNo&&sameText(x.modelNo,p.modelNo)) || (p.name&&x.name&&sameText(x.name,p.name)));
 if(dup)return notify(`Duplicate product detected: ${productLookupText(dup)} — ${dup.sku}. Please use the existing product instead.`);
 try{if(cloudReady){await cloudUpsertProduct(p);await loadCloudData((await sb.auth.getSession()).data.session)}else{db.products.push(p);save()}closeModal();render();notify('Product created successfully.')}catch(e){notify('Could not create product: '+(e?.message||String(e)))}}

async function bulkDealersExcelImport(ev){
 const f=ev.target.files[0];if(!f)return;
 try{
  if(!isMaster())throw new Error('Master access required');
  if(typeof XLSX==='undefined')throw new Error('Excel engine is not loaded. Please refresh the page.');
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:false});
  const ws=wb.Sheets[wb.SheetNames[0]];if(!ws)throw new Error('No worksheet found.');
  const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});if(!rows.length)throw new Error('No dealer rows found.');
  let updated=0,created=0,unchanged=0;
  for(const x of rows){
   const d=dealerImportRowToDealer(x);if(!d.name)continue;
   const existing=findExistingDealerForImport(d);
   if(existing){
    const changed=String(existing.name||'')!==d.name||String(existing.phone||'')!==d.phone||String(existing.address||'')!==d.address||String(existing.gstin||'')!==d.gstin||Number(existing.opening||0)!==d.opening||Number(existing.creditLimit||0)!==d.creditLimit||Boolean(existing.active!==false)!==Boolean(d.active);
    d.dbId=existing.dbId;d.id=existing.id;
    if(changed){await cloudUpsertDealer(d);updated++;}else unchanged++;
   }else{
    d.id='';await cloudUpsertDealer(d);created++;
   }
  }
  await loadCloudData((await sb.auth.getSession()).data.session);render();
  notify(`Dealer Excel processed successfully.\n\nUpdated: ${updated}\nNew dealers: ${created}\nNo changes: ${unchanged}`);
 }catch(e){notify('Dealer Excel import failed: '+(e?.message||String(e)));}
 ev.target.value='';
}

async function saveDealerEdit(i){
 const d=db.dealers[i]; if(!d)return;
 const name=(document.getElementById('ed_name')?.value||'').trim(),phone=(document.getElementById('ed_phone')?.value||'').trim(),beat=(document.getElementById('ed_beat')?.value||'').trim(),gstin=(document.getElementById('ed_gstin')?.value||'').trim(),address=(document.getElementById('ed_address')?.value||'').trim(),opening=Number(document.getElementById('ed_open')?.value||0),creditLimit=Number(document.getElementById('ed_credit')?.value||0);
 if(!name)return notify('Dealer name is required.');
 try{if(cloudReady){const {error}=await sb.from('dealers').update({name,phone,beat,address,gstin,opening_balance:opening,credit_limit:creditLimit}).eq('id',d.dbId);if(error)throw error;await loadCloudData((await sb.auth.getSession()).data.session)}else{Object.assign(d,{name,phone,beat,gstin,address,opening,creditLimit});save()}closeModal();render()}catch(e){notify('Could not update dealer: '+(e?.message||String(e)))}
}
function viewDealer(i){const d=db.dealers[i];if(d)viewDealerById(d.dbId||d.id)}
function viewDealerById(id){
 const d=db.dealers.find(x=>String(x.dbId||x.id)===String(id)||String(x.id)===String(id)); if(!d)return notify('Dealer not found.');
 const bills=db.bills.filter(x=>x.dealerId===d.id), pays=db.payments.filter(x=>x.dealerId===d.id);
 const returns=[];(db.trips||[]).forEach(t=>(t.returns||[]).forEach(r=>{const b=db.bills.find(x=>x.dbId===r.invoiceId);if(b&&b.dealerId===d.id)returns.push(r)}));
 const renderRows=(from,to)=>{const tx=[];bills.forEach(b=>tx.push({date:b.date,type:'Invoice',ref:b.invoice,amount:Number(b.amount||0),debit:Number(b.amount||0),credit:0}));pays.forEach(p=>tx.push({date:p.date,type:'Payment',ref:p.invoice||p.reference||'',amount:Number(p.amount||0),debit:0,credit:Number(p.amount||0)}));returns.forEach(r=>{const b=db.bills.find(x=>x.dbId===r.invoiceId);const o=db.orders.find(x=>x.dbId===b?.orderId);const it=(o?.items||[]).find(z=>String(z.productId)===String(r.productId)||String(z.sku)===String(r.sku||r.productSku));const value=Number(r.qty||0)*Number(it?.price||0);tx.push({date:r.date,type:'Return / Credit',ref:b?.invoice||'',amount:value,debit:0,credit:value})});tx.sort((a,b)=>String(a.date).localeCompare(String(b.date)));let run=Number(d.opening||0);tx.forEach(x=>{if(String(x.date||'')<from)run+=x.debit-x.credit});const visible=tx.filter(x=>String(x.date||'')>=from&&String(x.date||'')<=to);visible.forEach(x=>{run+=x.debit-x.credit;x.running=run});return visible};
 const def=currentMonthRange();openModal(`<div class="modalhead"><h2>${esc(d.name)} — Dealer Ledger</h2><button class="close" onclick="closeModal()">Close</button></div><div class="cards"><div class="card"><div class="label">Opening Balance</div><div class="value">${money(d.opening||0)}</div></div><div class="card"><div class="label">Outstanding</div><div class="value">${money(balance(d.id))}</div></div><div class="card"><div class="label">Credit Limit</div><div class="value">${money(d.creditLimit||0)}</div></div></div><div class="date-range"><div class="field"><label>From Date</label><input id="dl_from" type="date" value="${def.from}"></div><div class="field"><label>To Date</label><input id="dl_to" type="date" value="${def.to}"></div><button class="btn secondary" onclick="refreshDealerLedger('${esc(d.dbId||d.id)}')">Apply</button><button class="btn secondary" onclick="exportDealerLedger('${esc(d.dbId||d.id)}')">Export Excel</button></div><div id="dealerLedgerBody"></div>`);renderDealerLedgerBody(d.dbId||d.id,def.from,def.to,renderRows)}
function renderDealerLedgerBody(id,from,to,renderer){const d=db.dealers.find(x=>String(x.dbId||x.id)===String(id)||String(x.id)===String(id));if(!d)return;const rows=renderer(from,to);document.getElementById('dealerLedgerBody').innerHTML=`<div class="tablewrap" style="margin-top:14px"><table><thead><tr><th>Date</th><th>Type</th><th>Reference</th><th>Debit</th><th>Credit</th><th>Running Balance</th></tr></thead><tbody>${rows.map(x=>`<tr><td class="cell">${esc(x.date)}</td><td class="cell">${esc(x.type)}</td><td class="cell">${esc(x.ref)}</td><td class="cell">${x.debit?money(x.debit):'—'}</td><td class="cell">${x.credit?money(x.credit):'—'}</td><td class="cell"><b>${money(x.running)}</b></td></tr>`).join('')||'<tr><td colspan="6" class="cell">No transactions in selected period.</td></tr>'}</tbody></table></div>`}
function dealerLedgerRows(id,from,to){const d=db.dealers.find(x=>String(x.dbId||x.id)===String(id)||String(x.id)===String(id));if(!d)return [];const tx=[];(db.bills||[]).filter(x=>x.dealerId===d.id&&String(x.date||'')>=from&&String(x.date||'')<=to).forEach(b=>tx.push({date:b.date,type:'Invoice',ref:b.invoice,debit:Number(b.amount||0),credit:0}));(db.payments||[]).filter(x=>x.dealerId===d.id&&String(x.date||'')>=from&&String(x.date||'')<=to).forEach(p=>tx.push({date:p.date,type:'Payment',ref:p.invoice||p.reference||'',debit:0,credit:Number(p.amount||0)}));tx.sort((a,b)=>String(a.date).localeCompare(String(b.date)));let run=Number(d.opening||0);tx.forEach(x=>{run+=x.debit-x.credit;x.running=run});return tx}

function exportDealerLedger(id){const f=document.getElementById('dl_from')?.value||currentMonthRange().from,t=document.getElementById('dl_to')?.value||currentMonthRange().to,d=db.dealers.find(x=>String(x.dbId||x.id)===String(id)||String(x.id)===String(id));const rows=dealerLedgerRows(id,f,t);excelDownload([['Date','Type','Reference','Debit','Credit','Running Balance'],...rows.map(x=>[x.date,x.type,x.ref,x.debit||0,x.credit||0,x.running||0])],`${(d?.name||'dealer').replace(/[^a-z0-9]+/gi,'_')}_ledger.xlsx`)}


function invoiceAllocatedReceived(b){
 const allocs=Array.isArray(db.paymentAllocations)?db.paymentAllocations:[];
 if(allocs.length){return allocs.filter(a=>String(a.invoice_id||a.invoiceId||'')===String(b.dbId)).reduce((a,x)=>a+Number(x.amount||0),0)}
 return (db.payments||[]).filter(p=>p.invoiceId===b.dbId || (p.dealerId===b.dealerId&&p.invoice===b.invoice)).reduce((a,p)=>a+Number(p.amount||0),0);
}
function paymentStatusLabel(b){
 const received=invoiceAllocatedReceived(b);
 const bal=Math.max(0,Number(b.amount||0)-received);
 if(String(b.status||'').toLowerCase()==='closed' || (b.deliveryStatus==='delivered' && bal<=0)) return {label:'Closed',cls:'green',received,balance:0};
 if(received>0)return {label:'Part Paid',cls:'amber',received,balance:bal};
 return {label:'Unpaid',cls:'red',received,balance:bal};
}
function currentMonthRange(){const d=new Date(), y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0');return {from:`${y}-${m}-01`,to:new Date(y,d.getMonth()+1,0).toISOString().slice(0,10)}}

function applyPaymentDateRange(){const f=document.getElementById('pay_from')?.value||'',t=document.getElementById('pay_to')?.value||'';if(!f||!t)return notify('Please select both dates.');if(f>t)return notify('From date cannot be after To date.');window._paymentFrom=f;window._paymentTo=t;render()}
function paymentDateTitle(from,to){const a=new Date(from+'T00:00:00'),b=new Date(to+'T00:00:00');const opts={month:'long',year:'numeric'};if(from.slice(0,7)===to.slice(0,7))return a.toLocaleDateString('en-IN',opts)+' Transactions';return `${a.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})} — ${b.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}`}
function invoiceAgeDays(date){if(!date)return 0;const d=new Date(String(date).slice(0,10)+'T00:00:00');if(Number.isNaN(d.getTime()))return 0;const now=new Date();now.setHours(0,0,0,0);return Math.max(0,Math.floor((now-d)/86400000));}
function paymentReminderRows(){const rows=[];for(const b of (db.bills||[])){const due=getInvoicePaymentDue(b);if(due<=0)continue;const d=(db.dealers||[]).find(x=>String(x.id)===String(b.dealerId));if(!d)continue;const days=invoiceAgeDays(b.date),bucket=days<=15?'0–15 days':days<=30?'16–30 days':days<=60?'31–60 days':'61+ days';rows.push({d,b, due,days,bucket});}rows.sort((a,b)=>b.days-a.days||b.due-a.due||String(a.d.name).localeCompare(String(b.d.name)));return rows;}
function renderPaymentReminders(){const rows=paymentReminderRows(),sum=pred=>rows.filter(pred).reduce((a,x)=>a+x.due,0),buckets=[['0–15 days',x=>x.days<=15],['16–30 days',x=>x.days>15&&x.days<=30],['31–60 days',x=>x.days>30&&x.days<=60],['61+ days',x=>x.days>60]];return `<div class="section"><div class="sectionhead"><div><h2>Payment Reminders & Ageing</h2><div class="muted">Unpaid and part-paid invoices, oldest first. Age is counted from invoice date.</div></div><div class="spacer"></div><button class="btn secondary" onclick="window._reminderSort=window._reminderSort==='amount'?'days':'amount';render()">Sort by ${window._reminderSort==='amount'?'Days Due':'Amount Due'}</button></div><div class="payment-reminder-grid">${buckets.map(([label,pred])=>`<div class="card"><div class="label">${label}</div><div class="value">${money(sum(pred))}</div><div class="muted">${rows.filter(pred).length} invoices</div></div>`).join('')}</div><div class="tablewrap"><table><thead><tr><th>Dealer</th><th>Invoice</th><th>Invoice Date</th><th>Age</th><th>Amount Due</th><th>Contact</th><th>Action</th></tr></thead><tbody>${(window._reminderSort==='amount'?rows.slice().sort((a,b)=>b.due-a.due||b.days-a.days):rows).map(x=>`<tr><td class="cell"><b>${esc(x.d.name)}</b><div class="muted">${esc(x.d.id)}</div></td><td class="cell">${esc(x.b.invoice||'')}</td><td class="cell">${esc(x.b.date||'—')}</td><td class="cell"><span class="aging-chip ${x.days>60?'late':x.days>15?'overdue':''}">${x.days} days</span><div class="muted">${x.bucket}</div></td><td class="cell"><b>${money(x.due)}</b></td><td class="cell">${phoneActions(x.d.phone)}</td><td class="table-actions"><button class="btn small secondary" onclick="viewDealerById('${esc(x.d.dbId||x.d.id)}')">Ledger</button><button class="btn small" onclick="openPaymentReminderMessage('${esc(x.d.id)}','${esc(x.b.invoice||'')}','${Number(x.due)}',${x.days})">Remind</button></td></tr>`).join('')||'<tr><td colspan="7" class="cell">No outstanding invoices to remind.</td></tr>'}</tbody></table></div></div>`;}
function openPaymentReminderMessage(dealerId,invoice,amount,days){const d=(db.dealers||[]).find(x=>String(x.id)===String(dealerId));if(!d)return;const msg=`Dear ${d.name}, this is a gentle reminder regarding payment of ₹${Number(amount).toLocaleString('en-IN',{maximumFractionDigits:2})} against invoice ${invoice||''}. Invoice age: ${days} days. Kindly arrange payment and share confirmation. Regards, Purvanchal Traders.`;const digits=String(d.phone||'').replace(/\D/g,'');if(!digits)return notify('No phone number is saved for this dealer.');const wa=digits.length===10?'91'+digits:digits;window.open('https://wa.me/'+wa+'?text='+encodeURIComponent(msg),'_blank','noopener');}

 document.getElementById('payments').innerHTML=`${renderPaymentReminders()}<div class="section"><div class="sectionhead"><h2>Dealer Outstanding</h2><div class="spacer"></div></div><div class="tablewrap"><table><thead><tr><th>Dealer</th><th>Dealer ID</th><th>Opening</th><th>Invoiced</th><th>Paid</th><th>Outstanding</th><th>Action</th></tr></thead><tbody>${outs.map(x=>`<tr><td class="cell">${esc(x.name)}</td><td class="cell">${esc(x.code)}</td><td class="cell">${money(x.opening)}</td><td class="cell">${money(x.invoiced)}</td><td class="cell">${money(x.paid)}</td><td class="cell"><b>${money(x.outstanding)}</b></td><td class="table-actions"><button class="btn small secondary" onclick="viewDealerById('${esc(x.dealerId)}')">Ledger</button></td></tr>`).join('')}</tbody></table></div></div>
 <div class="section"><div class="sectionhead"><div><h2>${paymentDateTitle(range.from,range.to)}</h2><div class="muted">One unified invoice, Tally/GST, delivery and collection register.</div></div><div class="row"><button class="btn secondary" onclick="downloadTallyInvoiceTemplate()">Download Tally Template</button><label class="btn secondary" style="cursor:pointer">Import Tally Excel<input hidden type="file" accept=".xlsx,.xls" onchange="importTallyInvoices(event)"></label><button class="btn" onclick="recordGeneralPayment()">+ Record Payment</button></div></div>
 <div class="date-range"><div class="field"><label>From Date</label><input id="pay_from" type="date" value="${range.from}"></div><div class="field"><label>To Date</label><input id="pay_to" type="date" value="${range.to}"></div><button class="btn secondary" onclick="applyPaymentDateRange()">Apply Date Range</button><button class="btn secondary" onclick="window._paymentFrom=window._paymentTo=null;render()">Current Month</button></div>
 <div class="notice" style="margin-top:12px">Only approved orders are listed. Enter/import the original Tally/GST invoice number here. It then becomes available to Fleet. Invoice status: <b>Unpaid → Part Paid → Closed</b>.</div>
 <div class="toolbar"><div class="search"><input placeholder="Search invoice, order, dealer" oninput="filterPaymentTable(this.value)"></div><select class="filter" onchange="filterPaymentStatus(this.value)"><option value="all">All</option><option value="Unpaid">Unpaid</option><option value="Part Paid">Part Paid</option><option value="Closed">Closed</option></select></div>
 <div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Order</th><th>Date</th><th>Dealer</th><th>Invoice Amount</th><th>Received</th><th>Balance</th><th>Delivery</th><th>Status</th><th>Action</th></tr></thead><tbody id="paymentBody">${rows||'<tr><td colspan="10" class="cell">No transactions in selected period.</td></tr>'}</tbody></table></div>${(window._tallyImportIssues||[]).length?`<div class="section" style="margin-top:14px"><div class="sectionhead"><h3>Last Tally Import — Unmatched / Issues</h3></div><div class="tablewrap"><table><thead><tr><th>Order</th><th>Invoice</th><th>Issue</th></tr></thead><tbody>${(window._tallyImportIssues||[]).map(x=>`<tr><td class="cell">${esc(x.order||'')}</td><td class="cell">${esc(x.invoice||'')}</td><td class="cell">${esc(x.reason||'')}</td></tr>`).join('')}</tbody></table></div></div>`:''}</div>
 <div class="section"><div class="sectionhead"><h2>Payment Collection — ${paymentDateTitle(range.from,range.to)}</h2></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Invoice</th><th>Dealer</th><th>Mode</th><th>Reference / UTR</th><th>Amount</th></tr></thead><tbody>${filteredPayments.slice().reverse().map(p=>{let d=db.dealers.find(x=>x.id===p.dealerId);return `<tr><td class="cell">${p.date||''}</td><td class="cell">${esc(p.invoice||'')}</td><td class="cell">${esc(d?d.name:'')}</td><td class="cell">${esc(p.mode||'')}</td><td class="cell">${esc(p.reference||'')}</td><td class="cell">${money(p.amount)}</td></tr>`}).join('')||'<tr><td colspan="6" class="cell">No payments in selected period.</td></tr>'}</tbody></table></div></div><div class="section"><div class="sectionhead"><h2>Tally / Order Reconciliation</h2><div class="muted">Exceptions that need attention before financial closure.</div></div><div class="tablewrap"><table><thead><tr><th>Order</th><th>Invoice</th><th>Dealer</th><th>Check</th><th>Action</th></tr></thead><tbody>${(db.bills||[]).filter(b=>String(b.date||'')>=range.from&&String(b.date||'')<=range.to).map(b=>{const o=db.orders.find(x=>x.dbId===b.orderId),d=db.dealers.find(x=>x.id===b.dealerId),ps=paymentStatusLabel(b);const pending=!b.invoice||String(b.invoice).startsWith('INV-');const mismatch=o&&Number(o.amount||0)&&Math.abs(Number(o.amount)-Number(b.amount||0))>0.01;const issue=pending?'Tally invoice pending':mismatch?'Order / invoice amount mismatch':(b.deliveryStatus!=='delivered'?'Delivery pending':(ps.label!=='Closed'?'Payment pending':'Reconciled'));const action=pending?`<button class="btn small secondary" onclick="editTallyInvoice('${esc(b.dbId)}')">Enter Invoice</button>`:'—';return `<tr><td class="cell">${esc(o?.orderNo||'')}</td><td class="cell">${esc(b.invoice||'')}</td><td class="cell">${esc(d?.name||'')}</td><td class="cell"><span class="badge">${esc(issue)}</span></td><td class="cell">${action}</td></tr>`}).join('')||'<tr><td colspan="5" class="cell">No reconciliation exceptions in selected period.</td></tr>'}</tbody></table></div></div>`;

function filterPaymentTable(q){q=q.toLowerCase();document.querySelectorAll('#paymentBody tr').forEach(r=>r.style.display=r.dataset.search.includes(q)?'':'none')}
function filterPaymentStatus(v){document.querySelectorAll('#paymentBody tr').forEach(r=>r.style.display=v==='all'||r.dataset.status===v?'':'none')}
function recordPaymentForInvoice(dealerId,invoice){let b=db.bills.find(x=>x.dealerId===dealerId&&x.invoice===invoice);if(!b)return notify('Invoice not found');let ps=paymentStatusLabel(b);openTableForm('Receive Payment',['Payment Date','Payment Amount','Payment Mode','Reference / UTR / Cheque No.','Notes'],v=>{let amount=Number(v[1])||0;if(amount<=0||amount>ps.balance)return notify('Amount exceeds invoice balance');if(cloudReady){cloudInsertPayment({dealerId,invoiceId:b.dbId,invoice:b.invoice,date:v[0],amount,mode:v[2],reference:v[3],notes:v[4]}).then(async()=>{await loadCloudData((await sb.auth.getSession()).data.session);closeModal();render();notify('Payment recorded successfully.');}).catch(e=>notify('Could not record payment: '+e.message));}else{db.payments.push({date:v[0],dealerId,invoice:invoice,invoiceId:b.dbId,amount,mode:v[2],reference:v[3],notes:v[4]});save();render();}},[todayLocal(),'','UPI','',''])}
function dealerPaymentMatches(d,q){return !q||containsText(d.name,q)||containsText(d.id,q)||containsText(d.phone||'',q)}
function getDealerOutstandingForPayment(dealerId){
 const d=db.dealers.find(x=>x.id===dealerId||x.dbId===dealerId); if(!d)return 0;
 const row=(db.dealerOutstanding||[]).find(x=>String(x.dealerId)===String(d.dbId||d.id)||String(x.code)===String(d.id));
 let opening=Number(row?.opening||d.opening||0);
 const allocs=Array.isArray(db.paymentAllocations)?db.paymentAllocations:[];
 if(allocs.length){opening-=allocs.filter(a=>String(a.dealer_id)===String(d.dbId||d.id)&&String(a.allocation_type||'')==='opening').reduce((a,x)=>a+Number(x.amount||0),0)}
 else opening-=(db.payments||[]).filter(p=>String(p.dealerId)===String(d.id)&&!p.invoiceId).reduce((a,p)=>a+Number(p.amount||0),0);
 return Math.max(0,opening);
}
function getInvoicePaymentDue(b){return paymentStatusLabel(b).balance}
function buildPaymentAllocationPreview(dealerId,amount,invoiceId){
 const d=db.dealers.find(x=>x.id===dealerId||x.dbId===dealerId); if(!d)return {rows:[],remaining:Number(amount)||0};
 let remaining=Math.max(0,Number(amount)||0), rows=[];
 if(invoiceId){const b=db.bills.find(x=>String(x.dbId)===String(invoiceId)&&String(x.dealerId)===String(dealerId));if(b){const due=Math.max(0,getInvoicePaymentDue(b));const a=Math.min(remaining,due);if(a>0)rows.push({type:'invoice',invoiceId:b.dbId,invoice:b.invoice,amount:a,date:b.date});remaining-=a;}}
 else {
   const openingDue=Math.max(0,Number(getDealerOutstandingForPayment(dealerId))||0);
   const openingAlloc=Math.min(remaining,openingDue);
   if(openingAlloc>0){rows.push({type:'opening',invoiceId:null,invoice:'Opening Outstanding',amount:openingAlloc,date:''});remaining-=openingAlloc;}
   const bills=(db.bills||[]).filter(b=>String(b.dealerId)===String(dealerId)&&getInvoicePaymentDue(b)>0).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.invoice||'').localeCompare(String(b.invoice||'')));

async function saveOrderEdit(i){
 const o=db.orders[i];if(!o)return;

 const rows=[...document.querySelectorAll('#eo_lines tr')],items=[];
 for(const r of rows){

   if(!sku||qty<=0)continue;
   const p=db.products.find(x=>sameText(x.sku,sku));if(!p)return notify('Product not found: '+sku);
   items.push({productId:p.dbId,sku:p.sku,productName:p.name,qty,price});
 }
 if(!items.length)return notify('Order cannot be empty.');
 const seen=new Set();for(const x of items){const key=String(x.productId);if(seen.has(key))return notify('The same product cannot be added twice. Combine its quantity into one line.');seen.add(key);}
 const amount=items.reduce((a,x)=>a+x.qty*x.price,0);
 if(String(o.status).toLowerCase()==='approved'){
   if(!cloudReady)return notify('Cloud mode is required to safely modify an approved order.');
   try{
     const payload=items.map(x=>({product_id:x.productId,quantity:x.qty,unit_price:x.price}));
     const {error}=await sb.rpc('modify_approved_order',{p_order_id:o.dbId,p_items:payload,p_notes:`Whole order modified by Master. New value: ${money2(amount)}`});
     if(error)throw error;
     await loadCloudData((await sb.auth.getSession()).data.session);closeModal();render();notify('Whole approved order modified. Product swaps, additions/removals and stock adjustments were saved.');
   }catch(e){notify('Could not modify approved order: '+(e?.message||String(e)))}
   return;
 }
 try{
   if(cloudReady){
     const {error:e1}=await sb.from('orders').update({total_amount:amount,subtotal:amount,updated_at:new Date().toISOString()}).eq('id',o.dbId);if(e1)throw e1;
     const {error:e2}=await sb.from('order_items').delete().eq('order_id',o.dbId);if(e2)throw e2;
     for(const x of items){const {error:e3}=await sb.from('order_items').insert({order_id:o.dbId,product_id:x.productId,sku_snapshot:x.sku,product_name_snapshot:x.productName,quantity:x.qty,unit_price:x.price,amount:x.qty*x.price});if(e3)throw e3;}
     await loadCloudData((await sb.auth.getSession()).data.session);
   }else{o.items=items;o.amount=amount;save();}
   closeModal();render();notify('Whole order updated successfully.');
 }catch(e){notify('Could not update order: '+(e?.message||String(e)))}
}

function approvalDiscountCalc(gross,type,value){
 const v=Math.max(0,Number(value||0));
 if(type==='amount')return Math.min(v,gross);
 if(type==='percent')return gross*Math.min(v,100)/100;
 return 0;
}
function getApprovalLineDiscount(tr){
 const qty=Math.max(0,Number(tr.querySelector('.ap_qty')?.value||0));
 const price=Math.max(0,Number(tr.querySelector('.ap_price')?.value||0));
 const gross=qty*price;
 const type1=tr.querySelector('.ap_d1_type')?.value||'none',val1=Math.max(0,Number(tr.querySelector('.ap_d1_value')?.value||0));
 const d1=approvalDiscountCalc(gross,type1,val1);const after1=Math.max(0,gross-d1);
 const type2=tr.querySelector('.ap_d2_type')?.value||'none',val2=Math.max(0,Number(tr.querySelector('.ap_d2_value')?.value||0));
 const d2=approvalDiscountCalc(after1,type2,val2);const net=Math.max(0,after1-d2);
 return {qty,price,gross,type1,val1,d1,type2,val2,d2,net};
}
function recalcApproval(){
 let subtotal=0,totalD1=0,totalD2=0,netTotal=0;
 document.querySelectorAll('#approvalLines tr').forEach(tr=>{
   const inp=tr.querySelector('.ap_sku'),sku=inp?.dataset.productSku||inp?.value?.trim()||'',p=db.products.find(x=>sameText(x.sku,sku));
   if(p){tr.querySelector('.ap_stock').textContent=Number(p.stock||0);if(inp&&!inp.dataset.productSku)inp.dataset.productSku=p.sku;}
   const d=getApprovalLineDiscount(tr);subtotal+=d.gross;totalD1+=d.d1;totalD2+=d.d2;netTotal+=d.net;
   const d1a=tr.querySelector('.ap_d1_amount'),d2a=tr.querySelector('.ap_d2_amount'),cell=tr.querySelector('.ap_total');
   if(d1a)d1a.textContent='Discount: '+money2(d.d1);if(d2a)d2a.textContent='Discount: '+money2(d.d2);if(cell)cell.textContent=money(d.net);
 });
 const el=document.getElementById('approvalTotal');if(el)el.textContent='Approved Order Value: '+money(netTotal);
 const summary=document.getElementById('approvalDiscountSummary');
 if(summary)summary.innerHTML=`Subtotal: <b>${money(subtotal)}</b> · Total Discount 1: <b>${money2(totalD1)}</b> · Total Discount 2: <b>${money2(totalD2)}</b> · Net Order Value: <b>${money(netTotal)}</b><br><small>Each item's Discount 2 is calculated after that item's Discount 1.</small>`;
 return {subtotal,totalD1,totalD2,netTotal};
}
function approvalDiscountedItems(items){
 const out=[],audit=[];let subtotal=0,totalD1=0,totalD2=0,net=0;
 items.forEach(x=>{
   const qty=Number(x.quantity||0),price=Number(x.unit_price||0),gross=qty*price;
   const type1=x.discount1Type||'none',val1=Math.max(0,Number(x.discount1Value||0));
   const d1=approvalDiscountCalc(gross,type1,val1),after1=Math.max(0,gross-d1);
   const type2=x.discount2Type||'none',val2=Math.max(0,Number(x.discount2Value||0));
   const d2=approvalDiscountCalc(after1,type2,val2),lineNet=Math.max(0,after1-d2);
   const unitNet=qty?Number((lineNet/qty).toFixed(4)):0;
   out.push({product_id:x.product_id,quantity:qty,unit_price:unitNet});
   subtotal+=gross;totalD1+=d1;totalD2+=d2;net+=lineNet;
   const prod=db.products.find(p=>String(p.dbId)===String(x.product_id));
   audit.push(`${prod?.sku||x.sku||x.product_id}: Gross ${money2(gross)}, D1 ${type1==='amount'?money2(val1):type1==='percent'?val1+'%':'None'} (${money2(d1)}), D2 ${type2==='amount'?money2(val2):type2==='percent'?val2+'%':'None'} (${money2(d2)}), Net ${money2(lineNet)}`);
 });
 return {items:out,discounts:{subtotal,d1:totalD1,d2:totalD2,net,audit}};
}

async function saveSchemeCloud(){

 const name=document.getElementById('sc_name').value.trim(),startDate=document.getElementById('sc_start').value,end=document.getElementById('sc_end').value,scope=document.getElementById('sc_scope').value,mode=document.getElementById('sc_mode').value;

 const requirements=[...document.querySelectorAll('#sc_requirements .scheme-req-row')].map(r=>({requirement_type:r.querySelector('.sc_req_type')?.value||'category',category:r.querySelector('.sc_req_type')?.value==='category'?(r.querySelector('.sc_req_value')?.value||''):null,product_id:r.querySelector('.sc_req_type')?.value==='product'?(r.querySelector('.sc_req_value')?.value||''):null,quantity:Number(r.querySelector('.sc_req_qty')?.value||0)})).filter(x=>(x.category||x.product_id)&&x.quantity>0);
 const slabs=[...document.querySelectorAll('#sc_slabs .scheme-slab-row')].map(r=>{const rewardType=r.querySelector('.sc_slab_reward_type')?.value||'amount';const reqInputs=[...r.querySelectorAll('.sc_slab_req_qty')];return {multiple:Number(r.querySelector('.sc_slab_multiple')?.value||0),value:Number(r.querySelector('.sc_slab_value')?.value||0),reward_type:rewardType,freebie:rewardType==='freebie'?r.querySelector('.sc_slab_freebie')?.value.trim()||'':rewardType==='choice'?r.querySelector('.sc_slab_choice_freebie')?.value.trim()||'':'',requirements:mode==='basket'?requirements.map((q,idx)=>({...q,quantity:Number(reqInputs[idx]?.value||q.quantity)})):[]};}).filter(x=>x.multiple>0);
 if(!name||!startDate||!end||end<startDate)return notify('Enter a valid name and date range.');
 if(mode==='standard'&&threshold<=0)return notify('Enter a valid target for the standard scheme.');
 if(mode==='basket'&&requirements.length<1)return notify('Add at least one basket requirement.');
 if(mode==='basket'&&requirements.some(x=>x.quantity<=0))return notify('Enter valid quantities for every basket requirement.');
 if(scope==='selected'&&!dealers.length)return notify('Select at least one dealer, or choose All Dealers.');
 if(application==='slab'&&!slabs.length)return notify('Add at least one slab.');
 if(application==='slab'&&slabs.some(x=>x.reward_type!=='freebie'&&x.value<0))return notify('Enter valid slab rewards.');
 if(mode==='basket'&&application==='slab'&&slabs.some(x=>x.requirements.some(r=>Number(r.quantity||0)<=0)))return notify('Every slab must have a valid quantity for every basket requirement.');
 const encodedSlabs=mode==='basket'?slabs:slabs.map(x=>({...x,requirements:[]}));
 try{
  const {data,error}=await sb.from('schemes').insert({name,description:document.getElementById('sc_desc').value.trim()||null,start_date:startDate,end_date:end,basis:mode==='basket'?'quantity':basis,threshold:mode==='basket'?1:threshold,benefit_type:benefit,benefit_value:benefit==='freebie'||application==='slab'?0:value,benefit_application:application,settlement_method:document.getElementById('sc_settlement').value,slabs:application==='slab'?encodedSlabs:mode==='basket'?[{multiple:1,value:value,reward_type:benefit==='freebie'?'freebie':'amount',freebie:benefit==='freebie'?(freebie||null):'',requirements}]:[],freebie_description:benefit==='freebie'?(freebie||null):null,dealer_scope:scope,enabled:true,created_by:user.id}).select('*').single();
  if(error)throw error;
  if(mode==='standard'&&cats.length){const r=await sb.from('scheme_categories').insert(cats.map(category=>({scheme_id:data.id,category})));if(r.error)throw r.error}
  if(mode==='standard'&&products.length){const r=await sb.from('scheme_products').insert(products.map(product_id=>({scheme_id:data.id,product_id})));if(r.error)throw r.error}
  if(mode==='basket'){const unique=[...new Set(requirements.map(x=>x.product_id).filter(Boolean))];if(unique.length){const r=await sb.from('scheme_products').insert(unique.map(product_id=>({scheme_id:data.id,product_id})));if(r.error)throw r.error}}
  if(scope==='selected'){const r=await sb.from('scheme_dealers').insert(dealers.map(dealer_id=>({scheme_id:data.id,dealer_id})));if(r.error)throw r.error}
  closeModal();await loadCloudData((await sb.auth.getSession()).data.session);render();notify('Scheme created successfully with multi-category/product basket and slab rewards.');
 }catch(e){notify('Could not create scheme: '+e.message)}
}

async function deleteSchemeCloud(i){
 if(!isMaster())return notify('Master access required');
 const s=db.schemes[i]; if(!s?.dbId)return;
 if(!confirm(`Delete scheme ${s.name}?\n\nThis will remove its product/category/dealer links and settlement records. It cannot be undone.`))return;
 if(!cloudReady)return notify('Supabase connection required to delete a scheme.');
 try{
   const id=s.dbId;
   // Remove dependent records first so normal foreign-key constraints do not block deletion.
   const deps=[
     ['scheme_settlements','scheme_id'],
     ['scheme_products','scheme_id'],
     ['scheme_categories','scheme_id'],
     ['scheme_dealers','scheme_id']
   ];
   for(const [table,col] of deps){
     const {error}=await sb.from(table).delete().eq(col,id);
     if(error)throw error;
   }
   const {error}=await sb.from('schemes').delete().eq('id',id);
   if(error)throw error;
   await loadCloudData((await sb.auth.getSession()).data.session);
   render();
   notify('Scheme deleted successfully.');
 }catch(e){notify('Could not delete scheme: '+(e?.message||String(e)))}
}

async function savePurchaseEntry(){if(!isMaster())return notify('Master access required');const date=document.getElementById('pe_date')?.value||todayLocal(),bill=(document.getElementById('pe_bill')?.value||'').trim(),notes=(document.getElementById('pe_notes')?.value||'').trim();if(!bill)return notify('Reference purchase bill number is required.');const items=[...document.querySelectorAll('#purchaseLines tr')].map(r=>({productId:r.querySelector('.pe_product')?.dataset.productId||'',sku:r.querySelector('.pe_product')?.dataset.sku||'',quantity:Number(r.querySelector('.pe_qty')?.value||0)})).filter(x=>x.productId&&x.quantity>0);if(!items.length)return notify('Add at least one valid product and quantity.');const seen=new Set();for(const x of items){if(seen.has(String(x.productId)))return notify('A product is repeated. Combine its quantity into one line.');seen.add(String(x.productId));}
 try{if(cloudReady){const payload=items.map(x=>({product_id:x.productId,sku_snapshot:x.sku,quantity:x.quantity}));const {data,error}=await sb.rpc('record_purchase_entry',{p_purchase_date:date,p_reference_bill_number:bill,p_notes:notes||null,p_items:payload});if(error)throw error;await loadCloudData((await sb.auth.getSession()).data.session);closeModal();render();notify('Purchase entry saved and stock updated successfully.')}else{const id='PE-'+Date.now();const localItems=items.map(x=>({product_id:x.productId,sku_snapshot:x.sku,quantity:x.quantity}));localItems.forEach(x=>{const p=db.products.find(z=>String(z.dbId)===String(x.product_id)||z.sku===x.sku);if(p)p.stock=Number(p.stock||0)+x.quantity});db.purchases.unshift({id,purchase_date:date,reference_bill_number:bill,notes,items:localItems});save();closeModal();render();notify('Purchase entry saved and stock updated successfully.')}}catch(e){notify('Could not save purchase entry: '+(e?.message||String(e)))} }

async function saveDealerTakeaway(invoiceId){
 if(!isMaster())return notify('Master access required');
 const b=db.bills.find(x=>String(x.dbId)===String(invoiceId)); if(!b)return notify('Invoice not found.');
 const date=(document.getElementById('dt_date')?.value||'').trim()||null;
 const vehicle=(document.getElementById('dt_vehicle')?.value||'').trim()||null;
 const contact=(document.getElementById('dt_contact')?.value||'').trim()||null;
 const phone=(document.getElementById('dt_phone')?.value||'').trim()||null;
 const type=(document.getElementById('dt_type')?.value||'').trim()||null;
 const notes=(document.getElementById('dt_notes')?.value||'').trim()||null;
 try{
  if(cloudReady){
   const received=(db.payments||[]).filter(p=>p.invoiceId===b.dbId).reduce((a,p)=>a+Number(p.amount||0),0);
   const invoiceStatus=received>=Number(b.amount||0)?'closed':(received>0?'part_paid':'unpaid');
   const payload={delivery_status:'delivered',delivered_at:new Date().toISOString(),delivered_by:user.id,invoice_status:invoiceStatus,delivery_method:'dealer_takeaway',takeaway_vehicle_number:vehicle,takeaway_contact_name:contact,takeaway_contact_number:phone,takeaway_vehicle_type:type,takeaway_date:date,takeaway_notes:notes};
   const {error}=await sb.from('invoices').update(payload).eq('id',b.dbId);
   if(error)throw error;
   if(invoiceStatus==='closed'&&b.orderId){const {error:oe}=await sb.from('orders').update({status:'closed'}).eq('id',b.orderId);if(oe)throw oe;}
   await loadCloudData((await sb.auth.getSession()).data.session);closeModal();render();notify('Invoice marked delivered by dealer takeaway.');
  }else{
   b.deliveryStatus='delivered';b.deliveredAt=new Date().toISOString();b.deliveryMethod='dealer_takeaway';b.takeawayVehicleNumber=vehicle||'';b.takeawayContactName=contact||'';b.takeawayContactNumber=phone||'';b.takeawayVehicleType=type||'';b.takeawayDate=date||'';b.takeawayNotes=notes||'';
   const received=(db.payments||[]).filter(p=>p.invoiceId===b.dbId).reduce((a,p)=>a+Number(p.amount||0),0);b.status=received>=Number(b.amount||0)?'closed':(received>0?'part_paid':'unpaid');if(b.status==='closed'&&b.orderId){const o=db.orders.find(x=>x.dbId===b.orderId);if(o)o.status='Closed';}save();closeModal();render();notify('Invoice marked delivered by dealer takeaway.');
  }
 }catch(e){notify('Could not complete dealer takeaway: '+(e?.message||String(e)))}
}

async function addVehicleRow(){
 if(!isMaster()) return notify('Master access required');
 openTableForm('Add Vehicle',['Vehicle Number','Type (Own/Hired)','Driver / Owner','Phone'],async vals=>{
  const number=(vals[0]||'').trim();
  const type=(vals[1]||'Own').trim();
  const driver=(vals[2]||'').trim();
  const phone=(vals[3]||'').trim();
  if(!number) return notify('Please enter vehicle number.');
  if(!['Own','Hired'].includes(type)) return notify('Please select Own or Hired.');
  try{
   if(cloudReady){
    const {data:existing,error:ee}=await sb.from('vehicles').select('id,vehicle_number,registration_number').or(`vehicle_number.ilike.${number.replace(/,/g,'')},registration_number.ilike.${number.replace(/,/g,'')}`).limit(1).limit(1);
    if(ee) throw ee;
    if(existing && existing.length) return notify('This vehicle already exists.');
    const {error}=await sb.from('vehicles').insert({
      vehicle_number:number,
      registration_number:number,
      vehicle_type:type,
      owner_type:type.toLowerCase(),
      driver_name:driver||null,
      driver_phone:phone||null,
      active:true
    });
    if(error) throw error;
    const session=(await sb.auth.getSession()).data.session;
    await loadCloudData(session);
    closeModal(); render(); notify('Vehicle added successfully.');
   }else{
    if(db.vehicles.some(v=>String(v.number||'').trim().toLowerCase()===number.toLowerCase())) return notify('This vehicle already exists.');
    const id='V'+String(db.vehicles.length+1).padStart(4,'0');
    db.vehicles.push({id,number,type,driver,phone,active:true});
    save(); closeModal(); render(); notify('Vehicle added successfully.');
   }
  }catch(e){ notify('Could not add vehicle: '+e.message); }
 },['', 'Own', '', '']);
}

async function saveTripClosure(i){
 const t=db.trips[i],out=document.getElementById('ct_outcome')?.value||'Completed',summary=document.getElementById('ct_summary')?.value.trim()||'',issue=document.getElementById('ct_issue')?.value.trim()||'';
 if(!summary)return notify('Trip summary is required.');
 const inv=t?.invoices||[];
 if(!inv.length)return notify('This trip has no invoices to close.');
 try{
  if(cloudReady){
   // Finalize delivery/payment for every invoice in this trip from the same closure window.
   for(let j=0;j<inv.length;j++){
    notify(`Processing invoice ${j+1} of ${inv.length}...`);
    const x=inv[j],b=db.bills.find(z=>String(z.dbId)===String(x.invoiceId)||String(z.invoice)===String(x.invoice));
    if(!b)throw new Error(`Invoice ${x.invoice||''} could not be found.`);
    const status=document.getElementById(`ct_del_${j}`)?.value||'undelivered';
    const amount=Number(document.getElementById(`ct_amt_${j}`)?.value||0);
    const mode=document.getElementById(`ct_mode_${j}`)?.value||'Other';
    const reference=document.getElementById(`ct_ref_${j}`)?.value.trim()||'';
    const notes=document.getElementById(`ct_note_${j}`)?.value.trim()||'';
    const received=(db.payments||[]).filter(p=>p.invoiceId===b.dbId || (p.dealerId===b.dealerId&&p.invoice===b.invoice)).reduce((a,p)=>a+Number(p.amount||0),0);
    const balance=Math.max(Number(b.amount||0)-received,0);
    if(amount<0||amount>balance)throw new Error(`Payment for ${b.invoice} cannot exceed its remaining balance of ${money(balance)}.`);
    if(amount>0)await cloudInsertPayment({dealerId:b.dealerId,invoiceId:b.dbId,invoice:b.invoice,date:todayLocal(),amount,mode,reference,notes});
    const newReceived=received+amount;
    const invoiceStatus=status==='delivered' && newReceived>=Number(b.amount||0) ? 'closed' : (newReceived>0 ? 'part_paid' : 'unpaid');
    const {error}=await sb.from('invoices').update({delivery_status:status,delivered_at:status==='delivered'?new Date().toISOString():null,delivered_by:status==='delivered'?user.id:null,invoice_status:invoiceStatus}).eq('id',b.dbId);
    if(error)throw error;
    // Close the originating order only when its invoice is delivered and fully paid.
    if(invoiceStatus==='closed' && b.orderId){
      const {error:oe}=await sb.from('orders').update({status:'closed'}).eq('id',b.orderId);
      if(oe && !String(oe.message||'').toLowerCase().includes('invalid input value'))throw oe;
    }
   }
   const {error}=await sb.rpc('close_vehicle_trip',{p_trip_id:t.dbId,p_summary:`${out}: ${summary}`,p_issue_notes:issue||null});
   if(error)throw error;
   await loadCloudData((await sb.auth.getSession()).data.session);closeModal();render();notify('Trip closed. Delivery, invoice payment status and dealer ledger have been updated.');
  }else{
   Object.assign(t,{tripStatus:'closed',closeSummary:`${out}: ${summary}`,issueNotes:issue});save();closeModal();render();notify('Trip closed successfully.');
  }

async function saveDeliveryAndPayment(invoiceId, tripIndex){
 const status=document.getElementById('di_status')?.value||'delivered',amount=Number(document.getElementById('di_amount')?.value||0),mode=document.getElementById('di_mode')?.value||'Other',reference=document.getElementById('di_ref')?.value||'',notes=document.getElementById('di_notes')?.value||'';

  if(cloudReady){

   const {error}=await sb.from('invoices').update({delivery_status:status,delivered_at:status==='delivered'?new Date().toISOString():null,delivered_by:status==='delivered'?user.id:null,invoice_status:invoiceStatus}).eq('id',invoiceId);if(error)throw error;

   const refreshedTripIndex=db.trips.findIndex(x=>String(x.dbId)===String(refreshedTripDbId));

  }else{notify('Cloud mode is required for invoice delivery.');}
 }catch(e){notify('Could not update invoice: '+e.message)}
}

async function importTallyInvoices(event){

}

async function saveBulkAttendance(){

 const staff=(db.employees||[]).filter(e=>e.active!==false).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));if(!staff.length)return notify('No active employee records found.');
 const missing=staff.filter(e=>!e.dbId);if(missing.length)return notify('Some employee records are missing their database ID. Refresh or fix those employee records first.');
 if(!cloudReady)return notify('Attendance requires a Supabase connection so it can be saved permanently.');
 const btn=document.getElementById('bulkAttSaveBtn');if(btn){btn.disabled=true;btn.textContent='Saving…'}
 try{const now=new Date().toISOString();const payload=staff.map((e,i)=>({employee_id:e.dbId,attendance_date:date,status:document.getElementById('bulk_att_status_'+i)?.value||'Present',marked_by:user.id,updated_at:now}));const {error}=await sb.from('attendance_records').upsert(payload,{onConflict:'employee_id,attendance_date'});if(error)throw error;await loadCloudData((await sb.auth.getSession()).data.session);closeModal();render();notify(`Attendance saved for ${payload.length} staff members.`)}catch(err){if(btn){btn.disabled=false;btn.textContent='Save All Attendance'}notify('Could not save bulk attendance: '+(err?.message||String(err)))}
}

function parseCSV(text){
 const rows=[];let row=[],field='',quoted=false;
 for(let i=0;i<text.length;i++){
  const ch=text[i],next=text[i+1];
  if(ch==='"'){
   if(quoted && next==='"'){field+='"';i++;}
   else quoted=!quoted;
  }else if(ch===','&&!quoted){row.push(field);field='';}
  else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&next==='\n')i++;row.push(field);field='';if(row.some(v=>v!==''))rows.push(row);row=[];}
  else field+=ch;
 }
 if(field!==''||row.length){row.push(field);if(row.some(v=>v!==''))rows.push(row);}
 return rows;
}

function productImportRowToProduct(x){
 const brand=String(importValue(x,['brand'])||'').trim();
 const hasProductName=String(importValue(x,['product_name'])||'').trim()!=='';
 const rawName=String(importValue(x,['product_name','product / model','product','name'])||'').trim();
 // IMPORTANT: Excel's Product Name column is literal. A normal hyphen inside a product name
 // (e.g. "WHITE BLUE - SWH") must never be interpreted as Model No. + Product Name.
 // Only the dedicated Product / Model field may use the combined-field parser.
 const parts=hasProductName ? {modelNo:'',name:rawName} : productLookupParts(rawName);
 const sku=String(importValue(x,['sku'])||'').trim();
 return {sku,modelNo:parts.modelNo,brand,name:parts.name||rawName,category:String(importValue(x,['category'])||'').trim(),stock:Number(importValue(x,['stock'])||0),price:Number(importValue(x,['wholesale_price','wholesale price'])||0),retailPrice:Number(importValue(x,['minimum_retail_price','minimum retail price'])||0),active:String(importValue(x,['active'])||'true').toLowerCase()!=='false'};

function findExistingProductForImport(p){
 const sku=String(p.sku||'').trim().toLowerCase();
 if(sku){
  const bySku=db.products.find(x=>String(x.sku||'').trim().toLowerCase()===sku);
  if(bySku)return bySku;
 }
 const brand=String(p.brand||'').trim().toLowerCase();
 const model=String(p.modelNo||'').trim().toLowerCase();
 const name=String(p.name||'').trim().toLowerCase();
 if(brand && model){
  const byModel=db.products.find(x=>String(x.brand||'').trim().toLowerCase()===brand && String(x.modelNo||'').trim().toLowerCase()===model);
  if(byModel)return byModel;
 }
 if(brand && name){
  const byName=db.products.find(x=>String(x.brand||'').trim().toLowerCase()===brand && String(x.name||'').trim().toLowerCase()===name);
  if(byName)return byName;
 }
 // Repair legacy imports where a previous version incorrectly split Product Name at a hyphen.
 // Example: Excel "HAVELLs ZENO ... - IWH" vs old DB modelNo="HAVELLs ZENO ...", name="IWH".
 if(brand && name){
  const byLegacyCombined=db.products.find(x=>String(x.brand||'').trim().toLowerCase()===brand && importComparableProductText(`${x.modelNo||''} - ${x.name||''}`)===importComparableProductText(p.name||''));
  if(byLegacyCombined)return byLegacyCombined;
 }
 return db.products.find(x=>sameText(productLookupText(x),`${p.modelNo||''}${p.modelNo&&p.name?' — ':''}${p.name}`));
}

 if(r==='master_admin'||r==='master admin'||r==='owner'||r==='master')return 'master_admin';
 if(r==='wholesale_sales'||r==='wholesale sales user'||r==='wholesale sales'||r==='wholesale salesman'||r==='sales user')return 'wholesale_sales';
 if(r==='retail_employee'||r==='retail employee'||r==='retail')return 'retail_employee';
 return '';
}
function normalizeRole(r){
 r=String(r||'').toLowerCase();
 if(r==='master_admin'||r==='owner'||r==='master admin')return 'Master Admin';
 if(r==='wholesale_sales'||r==='wholesale sales user'||r==='wholesale sales')return 'Wholesale Sales User';
 if(r==='retail_employee'||r==='retail employee')return 'Retail Employee';
 return r||'Retail Employee';
}

let cloudLoadPromise=null;
async function loadCloudData(session){
 if(!session) return;
 // Coalesce accidental/concurrent refreshes so one UI action cannot launch multiple identical full syncs.
 if(cloudLoadPromise) return cloudLoadPromise;
 cloudLoadPromise=(async()=>{
 const profileRes=await sb.from('profiles').select('*').eq('id',session.user.id).single();
 if(profileRes.error) throw profileRes.error;
 const currentRole=normalizeRoleDb(profileRes.data.role);
 const master=currentRole==='master_admin';
 user={id:session.user.id,email:session.user.email,fullName:profileRes.data.full_name||session.user.email,role:currentRole,employeeId:profileRes.data.employee_id||''};
 const empty=()=>Promise.resolve({data:[],error:null});
 // Fleet, purchase, user-management and full profile datasets are Master-only. Do not query them for other roles;
 // this removes avoidable RLS-error traffic/log rows without changing what those users can do.
 const [pr,br,ca,de,inv,pa,allocations,or,oi,sc,sp,scat,sdel,sprog,doView,purchases,emp,veh,trips,tripInv,tripPay,tripRet,profiles,beatsRes,attRes]=await Promise.all([

  sb.from('payments').select('*').order('payment_date',{ascending:false}),
  sb.from('payment_allocations').select('*').order('created_at',{ascending:false}),
  sb.from('orders').select('*').order('order_date',{ascending:false}),

  sb.from('dealer_outstanding').select('*').order('dealer_name'),
  master?sb.from('purchase_entries').select('*, purchase_entry_items(*)').order('purchase_date',{ascending:false}):empty(),
  (master||isRetail())?sb.from('employees').select('*').order('name'):empty(),
  master?sb.from('vehicles').select('*').order('vehicle_number'):empty(),
  master?sb.from('vehicle_trips').select('*').order('trip_date',{ascending:false}):empty(),
  master?sb.from('vehicle_trip_invoices').select('*'):empty(),
  master?sb.from('vehicle_freight_payments').select('*').order('payment_date',{ascending:false}):empty(),
  master?sb.from('vehicle_trip_returns').select('*').order('returned_at',{ascending:false}):empty(),
  master?sb.from('profiles').select('*').order('full_name'):empty(),
  sb.from('beats').select('*').order('name'),
  (master||isRetail())?sb.from('attendance_records').select('*').order('attendance_date',{ascending:false}):empty()
 ]);
 const results={pr,br,ca,de,inv,pa,allocations,or,oi,sc,sp,scat,sdel,sprog,doView,purchases,emp,veh,trips,tripInv,tripPay,tripRet,profiles,beatsRes,attRes};
 const required=[pr,br,ca,de,inv,pa,or,oi,sc,sp,scat,sdel,sprog,doView];
 if(emp.error&&!isRetail())throw emp.error; if(emp.error&&isRetail())console.warn('Employee directory not available to retail role; own attendance can still be marked via linked employee ID.');
 const firstErr=required.find(x=>x.error);
 if(firstErr) throw firstErr.error;
 if(allocations.error) console.warn('Payment allocation table unavailable; apply the payment allocation migration to enable automatic FIFO allocation:',allocations.error.message);
 if(purchases.error) console.warn('Purchase Entry table unavailable until the purchase migration is applied:',purchases.error.message);
 // Tables restricted to Master (fleet/trips/profiles) may legitimately return RLS errors for non-Master users; keep login usable.
 if(veh.error) console.warn('Vehicles unavailable for this role:',veh.error.message);
 if(trips.error) console.warn('Trips unavailable for this role:',trips.error.message);
 if(tripInv.error) console.warn('Trip invoices unavailable:',tripInv.error.message);
 if(tripPay.error) console.warn('Freight payments unavailable:',tripPay.error.message);
 if(tripRet.error) console.warn('Trip returns unavailable:',tripRet.error.message);
 if(profiles.error) console.warn('Profiles unavailable for this role:',profiles.error.message);
 if(beatsRes.error) console.warn('Beat Master unavailable until the beat migration is applied:',beatsRes.error.message);
 db.products=pr.data.map(dbProductFromCloud);
 db.brands=br.data||[];
 db.categories=ca.data||[];
 db.dealers=de.data.map(dbDealerFromCloud);
 db.bills=inv.data.map(dbBillFromCloud);
 db.payments=pa.data.map(dbPaymentFromCloud);
 db.paymentAllocations=allocations.error?[]:(allocations.data||[]);
 db.orders=or.data.map(o=>dbOrderFromCloud(o,oi.data));
 db.schemes=sc.data.map(dbSchemeFromCloud);
 (sp.data||[]).forEach(x=>{const s=db.schemes.find(z=>z.dbId===x.scheme_id);if(s)s.productIds.push(x.product_id)});
 (scat.data||[]).forEach(x=>{const s=db.schemes.find(z=>z.dbId===x.scheme_id);if(s)s.categories.push(x.category)});
 (sdel.data||[]).forEach(x=>{const s=db.schemes.find(z=>z.dbId===x.scheme_id);if(s)s.dealerIds.push(x.dealer_id)});
 db.schemeProgress=sprog.data||[];
 const returnCreditByDealer={};
 (tripRet.data||[]).forEach(r=>{const b=db.bills.find(x=>String(x.dbId)===String(r.invoice_id));if(!b)return;const o=db.orders.find(x=>String(x.dbId)===String(b.orderId));const it=(o?.items||[]).find(z=>String(z.productId)===String(r.product_id)||String(z.sku)===String(r.product_sku||''));const v=Number(r.quantity||0)*Number(it?.price||0);returnCreditByDealer[b.dealerId]=(returnCreditByDealer[b.dealerId]||0)+v;});
 db.dealerOutstanding=(doView.data||[]).map(x=>({dealerId:x.dealer_id,code:x.dealer_code,name:x.dealer_name,opening:Number(x.opening_balance||0),invoiced:Number(x.total_invoiced||0),paid:Number(x.total_paid||0),outstanding:Number(x.outstanding||0),creditLimit:Number(x.credit_limit||0)}));
 if(!db.dealerOutstanding.length){db.dealerOutstanding=(db.dealers||[]).map(d=>{const invoiced=db.bills.filter(b=>String(b.dealerId)===String(d.id)).reduce((a,b)=>a+Number(b.amount||0),0);const paid=db.payments.filter(p=>String(p.dealerId)===String(d.id)).reduce((a,p)=>a+Number(p.amount||0),0);const credit=Number(returnCreditByDealer[d.id]||0);return {dealerId:d.dbId||d.id,code:d.id,name:d.name,opening:Number(d.opening||0),invoiced,paid,outstanding:Number(d.opening||0)+invoiced-paid-credit,creditLimit:Number(d.creditLimit||0)}})}
 db.employees=(emp.data||[]).map(dbEmployeeFromCloud);
 if(attRes.error){console.warn('Attendance cloud table unavailable; apply V64.43 migration:',attRes.error.message);db.attendance=[];}else{db.attendance=(attRes.data||[]).map(a=>{const e=db.employees.find(x=>String(x.dbId)===String(a.employee_id)||String(x.id)===String(a.employee_id));return {dbId:a.id,employeeDbId:a.employee_id,emp:e?e.id:String(a.employee_id),date:a.attendance_date,status:a.status,markedBy:a.marked_by||null};});}
 db.vehicles=(veh.data||[]).map(dbVehicleFromCloud);
 const vehicleMap=Object.fromEntries((veh.data||[]).map(v=>[v.id,v.vehicle_number||v.registration_number||'']));
 db.tripReturns=tripRet.data||[];
 db.trips=(trips.data||[]).map(t=>dbTripFromCloud(t,tripInv.data||[],tripPay.data||[],tripRet.data||[],vehicleMap));
 db.beats=(beatsRes.data||[]).map(x=>({id:x.id,name:x.name||'',description:x.description||'',active:x.active!==false}));
 db.userProfiles=(profiles.data||[]).map(dbProfileFromCloud);
 const profileById=Object.fromEntries((db.userProfiles||[]).map(p=>[String(p.dbId),p]));
 db.orders=(db.orders||[]).map(o=>{const creator=profileById[String(o.createdBy)]||null;const approver=profileById[String(o.approvedBy)]||null;return {...o,user:creator?.name||creator?.email||o.user||'',salesUser:creator?.name||creator?.email||o.user||'',approvedByName:approver?.name||approver?.email||o.approvedBy||''};});
 db.purchases=(results.purchases?.data||[]).map(x=>x);
 // Future-delivery bookings are stored separately from dealer orders, invoices and ledgers.
 if(canSeeWholesale()||isRetail()){
  try{
   const fbRes=await sb.from('future_delivery_bookings').select('*').order('created_at',{ascending:false});
   if(fbRes.error)throw fbRes.error;
   db.futureBookings=(fbRes.data||[]).map(x=>({dbId:x.id,bookingNo:x.booking_no,customerType:x.customer_type,customerName:x.customer_name,phone:x.customer_phone||'',address:x.customer_address||'',dealerDbId:x.dealer_id||null,date:x.booking_date,expectedDate:x.expected_delivery_date,items:Array.isArray(x.items)?x.items:[],total:Number(x.total_amount||0),advance:Number(x.advance_amount||0),status:x.status||'Booked',notes:x.notes||'',createdAt:x.created_at,createdBy:x.created_by}));
  }catch(e){db.futureBookings=db.futureBookings||[];console.warn('Future-delivery booking table unavailable; apply V64.43_FUTURE_DELIVERY_BOOKINGS.sql:',e.message||e)}
 }else db.futureBookings=[];
 normalizeLocalCollections();
 cloudReady=true;save();
 })();
 try{return await cloudLoadPromise;}finally{cloudLoadPromise=null;}
}
async function bootSupabase(){
 if(!sb){console.error('Supabase client was not initialized.');return;}
 try{
   const {data,error}=await sb.auth.getSession();
   if(error) throw error;
   if(data.session){
     try{await loadCloudData(data.session);enterApp();}
     catch(e){console.error(e);const st=document.getElementById('loginStatus');if(st){st.textContent='Session found, but cloud data could not be loaded: '+e.message;st.style.color='#c53b3b';}}
   }
 }catch(e){
   console.error('Supabase session error:',e);
   const st=document.getElementById('loginStatus');
   if(st){st.textContent='Supabase connection error: '+(e?.message||String(e));st.style.color='#c53b3b';}
 }
 sb.auth.onAuthStateChange(async(event,session)=>{
  if(event==='SIGNED_OUT'){user=null;cloudReady=false;document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');}
 });
}
async function cloudSignOut(){
 try{
  if(sb){const {error}=await sb.auth.signOut();if(error)throw error;}
 }catch(e){console.error('Supabase sign-out error:',e);notify('Could not sign out: '+(e?.message||String(e)));return;}
 user=null;cloudReady=false;current='dashboard';closeModal();
 document.getElementById('app')?.classList.add('hidden');document.getElementById('login')?.classList.remove('hidden');
 const u=document.getElementById('userInfo');if(u)u.textContent='';
 const w=document.getElementById('welcomeUser');if(w){w.textContent='';w.classList.add('hidden');}
 const st=document.getElementById('loginStatus');if(st){st.textContent='Signed out successfully.';st.style.color='#718096';}
 const p=document.getElementById('loginPass');if(p)p.value='';
}

async function deleteProductCloud(i){
 if(!isMaster())return notify('Master access required');
 const p=db.products[i]; if(!p)return;
 if(!confirm(`Delete product ${p.name} (${p.modelNo||p.sku})?\n\nIf this product has transaction or scheme history, deletion may be blocked for data safety.`))return;
 if(cloudReady){
  try{
   const {count,error:checkErr}=await sb.from('order_items').select('id',{count:'exact',head:true}).eq('product_id',p.dbId);
   if(checkErr)throw checkErr;
   const {count:scount,error:scErr}=await sb.from('scheme_products').select('id',{count:'exact',head:true}).eq('product_id',p.dbId);
   if(scErr)throw scErr;
   if((count||0)>0||(scount||0)>0) return notify('This product is already used in order/scheme history and cannot be deleted safely. You can deactivate it instead.');
   const {error}=await sb.from('products').delete().eq('id',p.dbId); if(error)throw error;
   await loadCloudData((await sb.auth.getSession()).data.session); render();
  }catch(e){notify('Could not delete product: '+e.message)}
 }else{db.products.splice(i,1);save();render()}
}
async function deleteDealerCloud(i){
 if(!isMaster())return notify('Master access required');
 const d=db.dealers[i]; if(!d)return;
 if(!confirm(`Delete dealer ${d.name} (${d.id})?\n\nThis is a permanent master-level deletion.`))return;
 if(cloudReady){
  try{
   const {count:oc,error:oe}=await sb.from('orders').select('id',{count:'exact',head:true}).eq('dealer_id',d.dbId); if(oe)throw oe;
   const {count:ic,error:ie}=await sb.from('invoices').select('id',{count:'exact',head:true}).eq('dealer_id',d.dbId); if(ie)throw ie;
   const {count:pc,error:pe}=await sb.from('payments').select('id',{count:'exact',head:true}).eq('dealer_id',d.dbId); if(pe)throw pe;
   if((oc||0)+(ic||0)+(pc||0)>0) return notify('This dealer has transaction history. For accounting safety, deletion is blocked. Deactivate the dealer instead.');
   const {error}=await sb.from('dealers').delete().eq('id',d.dbId); if(error)throw error;
   await loadCloudData((await sb.auth.getSession()).data.session); render();
  }catch(e){notify('Could not delete dealer: '+e.message)}
 }else{db.dealers.splice(i,1);save();render()}
}

 if(cloudReady){
  try{
   const {data:invs,error:ie}=await sb.from('invoices').select('id').eq('order_id',o.dbId); if(ie)throw ie;
   const ids=(invs||[]).map(x=>x.id);
   if(ids.length){const {error}=await sb.from('payments').delete().in('invoice_id',ids);if(error)throw error;const {error:e2}=await sb.from('invoices').delete().in('id',ids);if(e2)throw e2;}
   const {error:oiErr}=await sb.from('order_items').delete().eq('order_id',o.dbId);if(oiErr)throw oiErr;
   const {error:oErr}=await sb.from('orders').delete().eq('id',o.dbId);if(oErr)throw oErr;
   await loadCloudData((await sb.auth.getSession()).data.session);render();
  }catch(e){notify('Could not delete order: '+e.message)}
 }else{db.orders.splice(i,1);save();render()}
}
async function deleteInvoiceCloud(invoiceId){
 if(!isMaster())return notify('Master access required');
 if(!invoiceId)return notify('Invoice record not found. Refresh and try again.');
 const b=db.bills.find(x=>x.dbId===invoiceId); if(!b)return notify('Invoice not found.');
 if(!confirm(`Delete invoice ${b.invoice}?\n\nLinked payments will also be deleted. The underlying sales order will remain.`))return;
 if(cloudReady){
  try{
   const {error:pe}=await sb.from('payments').delete().eq('invoice_id',invoiceId);if(pe)throw pe;
   const {error:ie}=await sb.from('invoices').delete().eq('id',invoiceId);if(ie)throw ie;
   await loadCloudData((await sb.auth.getSession()).data.session);render();
  }catch(e){notify('Could not delete invoice: '+e.message)}
 }else{db.payments=(db.payments||[]).filter(x=>x.invoiceId!==invoiceId);db.bills=db.bills.filter(x=>x.dbId!==invoiceId);save();render()}
}

async function cloudUpsertProduct(p){
 const payload={model_no:p.modelNo||null,brand:p.brand,name:p.name,category:p.category,stock:Number(p.stock||0),wholesale_price:Number(p.price||0),minimum_retail_price:Number(p.retailPrice||0),active:p.active!==false};
 if(p.sku) payload.sku=p.sku;
 if(p.dbId){const {error}=await sb.from('products').update(payload).eq('id',p.dbId);if(error)throw error;}
 else {const {data,error}=await sb.from('products').insert(payload).select().single();if(error)throw error;p.dbId=data.id;p.sku=data.sku;}
}
async function cloudUpsertDealer(d){
 const payload={dealer_code:d.id,name:d.name,beat:d.beat||'',phone:d.phone||'',address:d.address||'',gstin:d.gstin||'',opening_balance:Number(d.opening||0),credit_limit:Number(d.creditLimit||0),active:true,created_by:user.id};
 if(d.dbId){const {error}=await sb.from('dealers').update(payload).eq('id',d.dbId);if(error)throw error;}
 else {delete payload.dealer_code;const {data,error}=await sb.from('dealers').insert(payload).select().single();if(error)throw error;d.dbId=data.id;d.id=data.dealer_code;}
}
async function cloudInsertPayment(p){

 const modeMap={'cash':'cash','upi':'upi','bank transfer':'bank_transfer','bank_transfer':'bank_transfer','neft':'neft','rtgs':'rtgs','cheque':'cheque','card':'card','other':'other'};const mode=modeMap[String(p.mode||'other').toLowerCase()]||'other';

const _saveNewOrderV22=saveNewOrder;
saveNewOrder=async function(){
 if(!cloudReady)return notify('Please sign in to Supabase first.');
 try{
   const dealerName=document.getElementById('ord_dealer').value.trim();
   const dealerId=document.getElementById('ord_dealer').dataset.dealerId;
   const dealer=db.dealers.find(d=>d.id===dealerId)||db.dealers.find(d=>sameText(d.name,dealerName)||sameText(d.id,dealerName));
   if(!dealer||!dealer.dbId)return notify('Please select a valid dealer from the search suggestions.');
   const lines=[...document.querySelectorAll('#newOrderLines tr')].map(r=>({
     sku:r.querySelector('.ol_sku').value.trim(),
     qty:+r.querySelector('.ol_qty').value||0,
     price:+r.querySelector('.ol_price').value||0
   })).filter(x=>x.sku&&x.qty);
   if(!lines.length)return notify('Add at least one product.');
   const shortages=lines.map(x=>{const p=db.products.find(p=>sameText(p.sku,x.sku));return p&&x.qty>Number(p.stock||0)?`${p.name}: ordered ${x.qty}, available ${Number(p.stock||0)}, shortage ${x.qty-Number(p.stock||0)}`:''}).filter(Boolean);
   const items=[];
   for(const x of lines){
     const prod=db.products.find(p=>p.sku.toLowerCase()===x.sku.toLowerCase());
     if(!prod||!prod.dbId)return notify('Product not found: '+x.sku);
     items.push({product_id:prod.dbId,quantity:x.qty,unit_price:x.price});
   }
   const orderDate=document.getElementById('ord_date').value||todayLocal();
   const {data,error}=await sb.rpc('create_sales_order',{
     p_dealer_id:dealer.dbId,
     p_order_date:orderDate,
     p_items:items,
     p_notes:null
   });
   if(error)throw error;
   await loadCloudData((await sb.auth.getSession()).data.session);
   closeModal();
   render();
   notify('Order '+(data?.order_number||'')+' submitted successfully and is now pending Master approval.'+(shortages.length?' Stock shortage noted: '+shortages.join('; '):''));
 }catch(e){
   console.error(e);
   notify('Could not save order: '+(e?.message||String(e)));
 }
};

window.approveEditedOrder=async function(i){
 if(!cloudReady)return notify('Please sign in to Supabase first.');
 if(!isMaster())return notify('Master access required');
 const o=db.orders[i];
 if(!o||!o.dbId)return notify('This order is not linked to Supabase. Refresh the page and try again.');
 try{
   const rows=[...document.querySelectorAll('#approvalLines tr')],items=[];
   for(const r of rows){
     const sku=r.querySelector('.ap_sku')?.value.trim()||'';
     const qty=+r.querySelector('.ap_qty')?.value||0;
     const price=+r.querySelector('.ap_price')?.value||0;
     if(!sku||qty<=0)continue;
     const prod=db.products.find(x=>sameText(x.sku,sku));
     if(!prod||!prod.dbId)throw new Error('Product not found: '+sku);
     if(qty>Number(prod.stock||0))throw new Error('Insufficient stock for '+prod.name+' (available: '+prod.stock+')');
     items.push({
       product_id:prod.dbId,
       quantity:qty,
       unit_price:price,
       discount1Type:r.querySelector('.ap_d1_type')?.value||'none',
       discount1Value:Math.max(0,Number(r.querySelector('.ap_d1_value')?.value||0)),
       discount2Type:r.querySelector('.ap_d2_type')?.value||'none',
       discount2Value:Math.max(0,Number(r.querySelector('.ap_d2_value')?.value||0))
     });
   }
   if(!items.length)return notify('Order cannot be empty.');
   const adj=approvalDiscountedItems(items);
   const d=adj.discounts;
   const discountSummary=`Item-wise discounts — Discount 1 total: ${money(d.d1)}; Discount 2 total: ${money(d.d2)}; Total discount: ${money2(d.d1+d.d2)}; Subtotal: ${money2(d.subtotal)}; Net: ${money2(d.net)}\n${d.audit.join('\n')}`;
   const {data,error}=await sb.rpc('approve_sales_order_with_schemes',{p_order_id:o.dbId,p_items:adj.items,p_notes:discountSummary});
   if(error)throw error;
   // Persist the approval discount summary for audit without changing the existing schema.
   try{await sb.from('orders').update({notes:discountSummary,updated_at:new Date().toISOString()}).eq('id',o.dbId);}catch(_e){}
   await loadCloudData((await sb.auth.getSession()).data.session);
   closeModal();render();
   notify('Order '+(data?.order_number||o.orderNo)+' approved. '+discountSummary);

// Global loading feedback: every cloud/async action gives immediate visual confirmation.
let _loadingDepth=0;
let _loadingTimer=null;
function startLoading(text='Processing…', button=null){
  _loadingDepth++;
  const ov=document.getElementById('globalLoading');
  const tx=document.getElementById('globalLoadingText');
  if(tx)tx.textContent=text;
  if(ov)ov.classList.add('show');
  if(button && button.classList){
    button.classList.add('loading');
    if(!button.querySelector('.btn-spinner')){
      const sp=document.createElement('span');sp.className='btn-spinner';sp.setAttribute('aria-hidden','true');button.prepend(sp);
    }
    button.dataset.loadingText=button.textContent.trim();
  }
  clearTimeout(_loadingTimer);
  _loadingTimer=setTimeout(()=>{if(_loadingDepth>0){_loadingDepth=0;document.querySelectorAll('.btn.loading').forEach(b=>{b.classList.remove('loading');const sp=b.querySelector('.btn-spinner');if(sp)sp.remove()});if(ov)ov.classList.remove('show')}},20000);
}
function stopLoading(button=null){
  _loadingDepth=Math.max(0,_loadingDepth-1);
  if(button && button.classList){button.classList.remove('loading');const sp=button.querySelector('.btn-spinner');if(sp)sp.remove();}
  if(_loadingDepth===0){clearTimeout(_loadingTimer);const ov=document.getElementById('globalLoading');if(ov)ov.classList.remove('show');document.querySelectorAll('.btn.loading').forEach(b=>{b.classList.remove('loading');const sp=b.querySelector('.btn-spinner');if(sp)sp.remove()});}
}

    const btn=document.getElementById('signInBtn');
    const email=(document.getElementById('loginUser')?.value||'').trim();
    const password=document.getElementById('loginPass')?.value||'';
    const setStatus=(m,e)=>{if(status){status.textContent=m;status.style.color=e?'#c53b3b':'#718096'}};
    if(!email||!password){setStatus('Enter your business email and password.',true);return;}
    if(!sb){setStatus('Secure sign-in is unavailable. Please reload the page.',true);return;}
    try{
      if(btn){btn.disabled=true;btn.textContent='Signing in…'}
      setStatus('Signing in…');
      const {data,error}=await sb.auth.signInWithPassword({email,password});
      if(error)throw error;
      if(!data?.session)throw new Error('No active session was returned.');
      setStatus('Loading your business data…');
      try{
        await loadCloudData(data.session);
      }catch(loadErr){
        /* Authentication succeeded. Do not turn a data/RLS error into an “invalid password” error. */
        console.error('ERP data load error after successful authentication:',loadErr);
        const meta=data.session.user.user_metadata||{};
        user={id:data.session.user.id,email:data.session.user.email,fullName:meta.full_name||data.session.user.email,role:normalizeRole(meta.role||'master_admin'),employeeId:meta.employee_id||''};

        normalizeLocalCollections();
        save();
        setStatus('Signed in. Some cloud data could not be loaded; please check your Supabase profile/RLS configuration.',true);
      }
      enterApp();
    }catch(e){
      console.error('Sign-in error:',e);
      setStatus('Sign-in failed: '+(e?.message||String(e)),true);
    }finally{
      if(btn){btn.disabled=false;btn.textContent='Sign in'}
    }
  };
