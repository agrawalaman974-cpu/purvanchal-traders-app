<script>
/* ================= V64.4 LIGHTWEIGHT OPERATIONS LAYER =================
   Design goal: keep the app cheap to host and cheap to run.
   - Supabase is the source of truth when connected.
   - Local audit/cache is capped to avoid localStorage growth.
   - No heavy PDF library; documents use browser print-to-PDF.
*/
(function(){
  const V='v644';
  function now(){return new Date().toISOString()}
  function audit(action,entity,ref,detail){
    try{
      const key='pt_v644_audit'; const a=JSON.parse(localStorage.getItem(key)||'[]');
      a.unshift({at:now(),user:(window.user?.username||window.user?.email||'user'),action,entity,ref:ref||'',detail:detail||''});
      localStorage.setItem(key,JSON.stringify(a.slice(0,250)));
    }catch(e){}
  }
  window.v644Audit=audit;
  window.v644AuditRows=function(){try{return JSON.parse(localStorage.getItem('pt_v644_audit')||'[]')}catch(e){return []}};

  function alertItems(){
    const a=[]; const bills=window.db?.bills||[], products=window.db?.products||[], orders=window.db?.orders||[], trips=window.db?.trips||[];
    const pendingInv=bills.filter(b=>!b.invoice||String(b.invoice).startsWith('INV-')).length;
    const pendingDelivery=bills.filter(b=>b.invoice&&b.deliveryStatus!=='delivered').length;
    const low=products.filter(p=>Number(p.stock||0)<=3).length;
    const pendingOrders=orders.filter(o=>String(o.status||'').toLowerCase()==='pending').length;
    const freight=trips.reduce((x,t)=>x+Math.max(Number(t.freight||0)-Number(t.paid||0),0),0);
    if(pendingInv)a.push({kind:'Invoice',title:`${pendingInv} invoice(s) need Tally/GST invoice numbers`,meta:'Payments & Invoice Status',go:"show('payments')"});
    if(pendingDelivery)a.push({kind:'Delivery',title:`${pendingDelivery} invoice(s) are awaiting delivery`,meta:'Fleet & Freight',go:"show('fleet')"});
    if(low)a.push({kind:'Stock',title:`${low} product(s) are at or below low-stock level`,meta:'Products & Pricing',go:"show('products')"});
    if(pendingOrders)a.push({kind:'Order',title:`${pendingOrders} order(s) are awaiting approval`,meta:'Orders',go:"show('orders')"});
    if(freight>0)a.push({kind:'Freight',title:`${money(freight)} freight is pending`,meta:'Fleet & Freight',go:"show('fleet')"});
    return a.slice(0,8);
  }

    const top=document.querySelector('.topbar'); if(!top)return;
    const wrap=document.createElement('div');wrap.id='v644NotifyWrap';wrap.className='v644-notify-wrap';
    wrap.innerHTML='<button class="v644-bell" aria-label="Notifications" onclick="v644ToggleNotifications(event)">🔔<span id="v644Badge" class="v644-badge">0</span></button><div id="v644Dropdown" class="v644-dropdown"></div>';
    top.appendChild(wrap); updateNotifications();
    document.addEventListener('click',e=>{if(!wrap.contains(e.target))document.getElementById('v644Dropdown')?.classList.remove('show')});
  }
  window.v644ToggleNotifications=function(e){e.stopPropagation();const d=document.getElementById('v644Dropdown');if(!d)return;d.classList.toggle('show');updateNotifications()}
  function updateNotifications(){
    const d=document.getElementById('v644Dropdown'),badge=document.getElementById('v644Badge');if(!d)return;const a=alertItems();badge.textContent=a.length;badge.style.display=a.length?'grid':'none';
    d.innerHTML='<div class="v644-drop-head">Action Centre</div>'+(a.map(x=>`<div class="v644-alert" onclick="${x.go};document.getElementById('v644Dropdown').classList.remove('show')"><b>${esc(x.title)}</b><small>${esc(x.kind)} · ${esc(x.meta)}</small></div>`).join('')||'<div class="v644-empty">Everything looks clear.</div>');
  }
  window.v644UpdateNotifications=updateNotifications;

  function invoiceTimeline(b){
    const o=(db?.orders||[]).find(x=>x.dbId===b.orderId||x.orderNo===b.orderNo);
    const trip=(db?.trips||[]).find(t=>(t.invoices||[]).some(x=>String(x.invoiceId)===String(b.dbId)||String(x.invoice)===String(b.invoice)));
    const ps=paymentStatusLabel(b); const steps=[
      ['Order Created',o?.date||b.date,!!o],
      ['Order Approved',o?.approvedDate||'',!!o&&['approved','closed'].includes(String(o.status||'').toLowerCase())],
      ['Tally / GST Invoice',b.invoice&& !String(b.invoice).startsWith('INV-')?b.date:'',!!(b.invoice&& !String(b.invoice).startsWith('INV-'))],
      ['Vehicle / Trip Assigned',trip?.date||'',!!trip],
      ['Delivered',b.deliveryStatus==='delivered'?'Delivered':'',b.deliveryStatus==='delivered'],
      ['Fully Paid',ps.received?`Received ${money(ps.received)}`:'',ps.label==='Closed']
    ];
    return '<div class="v644-timeline">'+steps.map(x=>`<div class="v644-step ${x[2]?'done':''}"><div class="v644-dot"></div><div><strong>${esc(x[0])}</strong><small>${x[2]?(x[1]||'Completed'):'Pending'}</small></div></div>`).join('')+'</div>';
  }
  window.v644InvoiceTimeline=function(i){
    const b=(db?.bills||[])[i];if(!b)return;const d=(db?.dealers||[]).find(x=>x.id===b.dealerId);const ps=paymentStatusLabel(b);
    openModal(`<div class="modalhead"><h2>${esc(b.invoice||'Invoice')} — Timeline</h2><button class="close" onclick="closeModal()">Close</button></div><div class="v644-kpis"><div class="v644-kpi"><span>Dealer</span><strong>${esc(d?.name||'')}</strong></div><div class="v644-kpi"><span>Invoice Value</span><strong>${money(b.amount)}</strong></div><div class="v644-kpi"><span>Received</span><strong>${money(ps.received)}</strong></div><div class="v644-kpi"><span>Balance</span><strong>${money(ps.balance)}</strong></div></div>${invoiceTimeline(b)}<div class="v644-share-row"><button class="btn secondary" onclick="v644ShareInvoice(${i})">Share Summary</button><button class="btn" onclick="closeModal();v64PrintDealer(${(db.dealers||[]).findIndex(x=>x.id===b.dealerId)})">Dealer Statement PDF</button></div>`);
  };
  window.v644ShareInvoice=function(i){
    const b=(db?.bills||[])[i];if(!b)return;const d=(db?.dealers||[]).find(x=>x.id===b.dealerId),ps=paymentStatusLabel(b);
    const text=`Purvanchal Traders\nInvoice: ${b.invoice||''}\nDealer: ${d?.name||''}\nAmount: ${money(b.amount)}\nReceived: ${money(ps.received)}\nBalance: ${money(ps.balance)}\nDelivery: ${b.deliveryStatus||'Undelivered'}\nStatus: ${ps.label}`;
    if(navigator.share)navigator.share({title:'Invoice Summary',text}).catch(()=>{});else window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
  };

  function addPaymentTimelineButtons(){
    document.querySelectorAll('#paymentBody tr').forEach((tr,i)=>{const td=tr.lastElementChild;if(td&&!td.querySelector('.v644-timeline-btn'))td.insertAdjacentHTML('afterbegin',`<button class="btn small secondary v644-timeline-btn" onclick="v644InvoiceTimeline(${i})">Timeline</button>`)});
  }

  function creditStatus(d){
    const limit=Number(d?.creditLimit||0), out=Math.max(Number(balance(d?.id||'')||0),0);
    if(!limit)return {text:'No credit limit set',cls:''};
    const pct=out/limit*100; return {text:`${money(Math.max(limit-out,0))} available (${Math.round(pct)}% used)`,cls:pct>=100?'red':pct>=80?'amber':'green'};
  }
  window.v644CreditStatus=creditStatus;

  /* Compact local audit viewer for Master users. It never stores business records. */
  window.v644ShowAudit=function(){if(typeof isMaster==='function'&&!isMaster())return notify('Master access required');const rows=v644AuditRows();openModal('<div class="modalhead"><h2>Recent Activity</h2><button class="close" onclick="closeModal()">Close</button></div><div class="tablewrap"><table><thead><tr><th>Date / Time</th><th>User</th><th>Action</th><th>Record</th><th>Details</th></tr></thead><tbody>'+(rows.map(x=>`<tr><td class="cell">${esc(new Date(x.at).toLocaleString('en-IN'))}</td><td class="cell">${esc(x.user)}</td><td class="cell">${esc(x.action)}</td><td class="cell">${esc(x.entity)} ${esc(x.ref)}</td><td class="cell">${esc(x.detail)}</td></tr>`).join('')||'<tr><td colspan="5" class="cell">No recent local activity.</td></tr>')+'</tbody></table></div><div class="v644-free-note">Audit cache is capped at 250 entries locally to keep browser storage small.</div>')};

  /* Wrap save once: localStorage quota protection + no duplicate large cache writes. */
  if(typeof window.save==='function'&&!window._v644SaveWrapped){
    const oldSave=window.save; window.save=function(){try{return oldSave()}catch(e){try{localStorage.removeItem('pt_v644_audit');return oldSave()}catch(e2){return null}}};window._v644SaveWrapped=true;
  }
  /* Record a few high-value actions without generating a large log. */
  function wrapAudit(name,action,entity){const fn=window[name];if(typeof fn!=='function'||fn._v644Wrapped)return;if(fn.constructor.name==='AsyncFunction')window[name]=async function(...args){try{const r=await fn.apply(this,args);audit(action,entity,args[0]??'','');return r}catch(e){throw e}};else window[name]=function(...args){const r=fn.apply(this,args);audit(action,entity,args[0]??'','');return r};window[name]._v644Wrapped=true}
  ['recordGeneralPayment','recordPaymentForInvoice','saveDeliveryAndPayment','saveDealerTakeaway','saveTripClosure','saveTallyInvoice','saveProductForm','saveDealerEdit','saveOrderEdit','saveFreightPayment','saveTrip','saveTripEdit'].forEach((n)=>wrapAudit(n,n.replace(/([A-Z])/g,' $1').trim(),'Transaction'));

  /* Improve reports: only transaction/inventory PDF, no master PDF. Excel stays for structured analysis. */
  const oldRender=window.render;
  if(typeof oldRender==='function'&&!window._v644RenderWrapped){
    window.render=function(){oldRender.apply(this,arguments);setTimeout(()=>{addNotificationCenter();updateNotifications();addPaymentTimelineButtons();},80)};window._v644RenderWrapped=true;
  }
  setTimeout(()=>{addNotificationCenter();updateNotifications();addPaymentTimelineButtons()},250);
})();
</script>
<script>
/* V64.43 — Future-delivery bookings. Separate from Sales Orders, inventory deduction, invoices and dealer ledgers. */
(function(){
 if(!Array.isArray(db.futureBookings))db.futureBookings=[];
 const priorRenderOrders=window.renderOrders;
 window.renderOrders=function(){
  const root=document.getElementById('orders');if(!root)return;
  if(isRetail())root.innerHTML='';else priorRenderOrders.apply(this,arguments);
  if(canSeeWholesale()||isRetail())root.insertAdjacentHTML('beforeend',renderFutureBookingSection());
 };
 window.renderFutureBookingSection=function(){
  const rows=(db.futureBookings||[]).slice().sort((a,b)=>String(b.createdAt||b.date||'').localeCompare(String(a.createdAt||a.date||'')));
  const active=rows.filter(x=>!['Delivered','Cancelled'].includes(x.status));
  const due=active.reduce((a,x)=>a+(Number(x.total||0)-Number(x.advance||0)),0);
  const rowHtml=rows.map((b,i)=>{const balance=Number(b.total||0)-Number(b.advance||0);return `<tr><td class="cell"><button class="link-btn" onclick="viewFutureBooking('${esc(b.dbId)}')">${esc(b.bookingNo||'Booking')}</button><div class="muted">${esc(b.date||'')}</div></td><td class="cell"><b>${esc(b.customerName||'')}</b><div class="muted">${esc(b.phone||'')}</div><div class="muted">${esc(b.customerType==='retail'?'Retail customer':'Existing dealer')}</div></td><td class="cell">${(b.items||[]).map(x=>esc(x.name||x.sku||'Product')+' × '+Number(x.qty||0)).join('<br>')}</td><td class="cell">${esc(b.expectedDate||'—')}</td><td class="cell">${money(b.total)}</td><td class="cell">${money(b.advance)}</td><td class="cell"><b style="color:${balance>0?'#b45309':balance<0?'#047857':'inherit'}">${balance>0?'− '+money(balance):balance<0?'+ '+money(Math.abs(balance)):'₹0.00'}</b><div class="muted">${balance>0?'Debit / Due':balance<0?'Credit / Excess Advance':'Settled'}</div></td><td class="cell"><span class="status ${b.status==='Delivered'?'green':b.status==='Cancelled'?'red':'amber'}">${esc(b.status||'Booked')}</span></td><td class="table-actions"><button class="btn small secondary" onclick="viewFutureBooking('${esc(b.dbId)}')">Details / Edit</button></td></tr>`}).join('');
  return `<div class="section" id="futureBookingsSection"><div class="sectionhead"><div><h2>Future Delivery Bookings</h2><div class="muted">Reserve products for a later delivery date, edit booked models and quantities, and track advance credit/debit.</div></div><div class="spacer"></div><button class="btn" onclick="openFutureBookingForm()">＋ New Future Booking</button></div><div class="notice"><b>Separate booking register:</b> Retail customers are saved here without creating a dealer account or ledger. Positive balance is Debit / Due; excess advance is shown as Credit. Bookings do not create GST invoices or deduct stock.</div><div class="future-booking-kpis"><div class="future-booking-kpi"><small>Total bookings</small><b>${rows.length}</b></div><div class="future-booking-kpi"><small>Active bookings</small><b>${active.length}</b></div><div class="future-booking-kpi"><small>Advance collected</small><b>${money(rows.reduce((a,x)=>a+Number(x.advance||0),0))}</b></div><div class="future-booking-kpi"><small>Net Debit / (Credit)</small><b>${due>0?"− ":due<0?"+ ":""}${money(Math.abs(due))}</b></div></div><div class="toolbar"><div class="search"><input placeholder="Search booking no., customer, phone or product" oninput="filterFutureBookings(this.value)"></div><select class="filter" onchange="filterFutureBookingStatus(this.value)"><option value="all">All statuses</option><option>Booked</option><option>Ready for Delivery</option><option>Delivered</option><option>Cancelled</option></select></div><div class="tablewrap"><table><thead><tr><th>Booking</th><th>Customer</th><th>Products / Qty</th><th>Expected Delivery</th><th>Total Value</th><th>Advance</th><th>Debit / Credit</th><th>Status</th><th>Action</th></tr></thead><tbody id="futureBookingRows">${rowHtml||'<tr><td class="cell" colspan="9">No future-delivery bookings recorded yet. Click “New Future Booking” to start.</td></tr>'}</tbody></table></div></div>`;
 };
 window.filterFutureBookings=function(q){const query=normText(q);document.querySelectorAll('#futureBookingRows tr').forEach(r=>r.style.display=!query||normText(r.textContent).includes(query)?'':'none')};
 window.filterFutureBookingStatus=function(v){document.querySelectorAll('#futureBookingRows tr').forEach(r=>{const s=(r.querySelector('.status')?.textContent||'').trim().toLowerCase();r.style.display=v==='all'||s===String(v).toLowerCase()?'':'none'})};
 window.openFutureBookingForm=function(){
  if(!canSeeWholesale()&&!isRetail())return notify('Retail, Wholesale Sales or Master access required.');
  if(!cloudReady)return notify('Please sign in to Supabase first.');
  if(!(db.products||[]).length)return notify('Add products before creating a booking.');
  const dealerOpts=(db.dealers||[]).map(d=>`<option value="${esc(d.dbId||'')}" data-name="${esc(d.name)}" data-phone="${esc(d.phone||'')}" data-code="${esc(d.id||'')}">${esc(d.name)} · ${esc(d.id||'')}</option>`).join('');
  openModal(`<div class="modalhead"><h2>New Future Delivery Booking</h2><button class="close" onclick="closeModal()">Close</button></div><div class="notice">Use this form when a customer books products now for delivery later and pays an advance. Retail customer details are stored only in this booking—no dealer account or ledger is created.</div><div class="formgrid"><div class="field"><label>Booking No.</label><input value="Auto-generated on save" readonly></div><div class="field"><label>Booking Date *</label><input id="fb_date" type="date" value="${todayLocal()}"></div><div class="field" ${isRetail()?'style="display:none"':''}><label>Customer Type *</label><select id="fb_type" onchange="futureBookingTypeChanged()" ${isRetail()?'disabled':''}><option value="retail">Retail Customer (No Ledger)</option>${isRetail()?'':'<option value="dealer">Existing Dealer</option>'}</select></div><div class="field" id="fb_dealer_wrap" style="display:none"><label>Select Existing Dealer</label><select id="fb_dealer" onchange="futureBookingFillDealer()"><option value="">Select dealer</option>${dealerOpts}</select></div><div class="field"><label>Customer Name *</label><input id="fb_name" placeholder="Customer / party name"></div><div class="field"><label>Mobile Number *</label><input id="fb_phone" type="tel" inputmode="tel" placeholder="10-digit mobile number"></div><div class="field full"><label>Delivery Address *</label><input id="fb_address" placeholder="House / street / locality / city"></div><div class="field"><label>Expected Delivery Date *</label><input id="fb_expected" type="date" min="${todayLocal()}" value="${todayLocal()}"></div><div class="field"><label>Advance Deposited (₹) *</label><input id="fb_advance" type="number" min="0" step="0.01" value="0" oninput="recalcFutureBooking()"></div><div class="field full"><label>Notes (optional)</label><input id="fb_notes" placeholder="Colour preference, delivery instructions, etc."></div></div><div class="section" style="margin-top:14px;padding:12px"><div class="sectionhead"><h3 style="margin:0">Booked Products</h3><div class="spacer"></div><button class="btn secondary" onclick="addFutureBookingLine()">＋ Add Product</button></div><div id="fb_lines" class="booking-lines"></div><div id="fb_totals" class="notice" style="margin:12px 0 0">Total: ₹0 · Advance: ₹0 · Balance: ₹0</div></div><div class="modal-actionbar"><button class="btn secondary mobile-action-btn" onclick="printFutureBookingDraft()">Print Booking</button><button class="btn mobile-action-btn" onclick="saveFutureBooking()">Save Booking</button></div>`);
  addFutureBookingLine();
 };
 window.futureBookingTypeChanged=function(){const type=isRetail()?'retail':document.getElementById('fb_type')?.value;const wrap=document.getElementById('fb_dealer_wrap');if(wrap)wrap.style.display=type==='dealer'?'block':'none';if(type!=='dealer'){const n=document.getElementById('fb_name');if(n)n.value='';const p=document.getElementById('fb_phone');if(p)p.value='';}};
 window.futureBookingFillDealer=function(){const s=document.getElementById('fb_dealer'),o=s?.selectedOptions?.[0];if(!o||!o.value)return;document.getElementById('fb_name').value=o.dataset.name||'';document.getElementById('fb_phone').value=o.dataset.phone||'';};
 window.futureBookingProductLabel=function(x){return `${x.name} · ${x.sku} (Stock ${Number(x.stock||0)})`;};
 window.futureBookingDefaultRate=function(p){return Number(isRetail()?(p?.retailPrice??p?.minimumRetailPrice??p?.price??0):(p?.price||0));};
 window.addFutureBookingLine=function(sku='',qty=1,rate=null){const root=document.getElementById('fb_lines');if(!root)return;const p=sku?db.products.find(x=>sameText(x.sku,sku)):null;const line=document.createElement('div');line.className='booking-line';line.innerHTML=`<div class="booking-product" style="position:relative"><input class="fb_product_search" type="text" autocomplete="off" placeholder="Type product name or SKU…" value="${p?esc(futureBookingProductLabel(p)):''}" oninput="futureBookingProductSearch(this)" onfocus="futureBookingProductSearch(this)" aria-label="Search and select product"><div class="fb_product_results" role="listbox" style="display:none;position:absolute;left:0;right:0;top:100%;z-index:30;max-height:220px;overflow:auto;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 8px 20px #0002"></div><select class="fb_product" onchange="recalcFutureBooking()" style="display:none" aria-hidden="true"><option value="">Select product</option>${(db.products||[]).map(x=>`<option value="${esc(x.sku)}" ${p&&sameText(x.sku,p.sku)?'selected':''}>${esc(x.name)} · ${esc(x.sku)}</option>`).join('')}</select></div><div><label class="muted">Quantity</label><input class="fb_qty" type="number" min="1" step="1" value="${Number(qty||1)}" oninput="recalcFutureBooking()"></div><div><label class="muted">Rate (₹)</label><input class="fb_rate" type="number" min="0" step="0.01" value="${rate===null?(p?futureBookingDefaultRate(p):0):Number(rate||0)}" oninput="recalcFutureBooking()"></div><div class="booking-line-total">₹0 <button class="btn small red booking-remove" type="button" onclick="this.closest('.booking-line').remove();recalcFutureBooking()">Remove</button></div>`;root.appendChild(line);if(p)line.querySelector('.fb_product').value=p.sku;recalcFutureBooking();};
 window.futureBookingProductSearch=function(input){const row=input.closest('.booking-line');if(!row)return;const sel=row.querySelector('.fb_product'),results=row.querySelector('.fb_product_results'),q=String(input.value||'').trim().toLocaleLowerCase();if(!results)return;const products=(db.products||[]).filter(x=>!q||[x.name,x.sku,x.brand,x.category].some(v=>String(v||'').toLocaleLowerCase().includes(q))).slice(0,40);results.innerHTML=products.map(x=>`<button type="button" role="option" style="display:block;width:100%;text-align:left;padding:9px 10px;border:0;border-bottom:1px solid #eef2f7;background:#fff;color:#182230;cursor:pointer" onmousedown="event.preventDefault();selectFutureBookingProduct(this,'${esc(x.sku)}')"><b>${esc(x.name||'')}</b><span style="display:block;font-size:12px;color:#64748b">${esc(x.sku||'')} · ${esc(x.brand||x.category||'')} · Stock ${Number(x.stock||0)} · ${money(futureBookingDefaultRate(x))}</span></button>`).join('')||'<div style="padding:10px;color:#64748b">No matching products found</div>';results.style.display='block';const exact=products.find(x=>sameText(futureBookingProductLabel(x),input.value.trim())||sameText(String(x.sku||''),input.value.trim()));if(exact)selectFutureBookingProduct(null,exact.sku,false);else{sel.value='';if(row.closest('#fb_edit_lines'))recalcFutureBookingEdit();else recalcFutureBooking();}};
 window.selectFutureBookingProduct=function(button,sku,hide=true){const row=button?button.closest('.booking-line'):document.activeElement?.closest?.('.booking-line')||document.querySelector('#fb_lines .booking-line:focus-within');if(!row)return;const p=(db.products||[]).find(x=>sameText(x.sku,sku));if(!p)return;row.querySelector('.fb_product').value=p.sku;row.querySelector('.fb_product_search').value=futureBookingProductLabel(p);row.querySelector('.fb_rate').value=futureBookingDefaultRate(p);const results=row.querySelector('.fb_product_results');if(results&&hide)results.style.display='none';if(row.closest('#fb_edit_lines'))recalcFutureBookingEdit();else recalcFutureBooking();};
 document.addEventListener('click',function(e){if(!e.target.closest('.booking-product'))document.querySelectorAll('.fb_product_results').forEach(x=>x.style.display='none');});
 window.recalcFutureBooking=function(){let total=0;document.querySelectorAll('#fb_lines .booking-line').forEach(r=>{const p=db.products.find(x=>sameText(x.sku,r.querySelector('.fb_product')?.value||''));const q=Math.max(0,Number(r.querySelector('.fb_qty')?.value||0)),rate=Math.max(0,Number(r.querySelector('.fb_rate')?.value||0)),amt=q*rate;total+=amt;const cell=r.querySelector('.booking-line-total');if(cell)cell.firstChild.textContent=money(amt)+' ';});const advance=Math.max(0,Number(document.getElementById('fb_advance')?.value||0));const box=document.getElementById('fb_totals');if(box)box.innerHTML=`<b>Total: ${money(total)}</b> &nbsp; · &nbsp; Advance: ${money(advance)} &nbsp; · &nbsp; Amount Due: <b>${money(Math.max(0,total-advance))}</b>${advance>total?` &nbsp; · &nbsp; Excess Advance/Credit: <b>${money(advance-total)}</b>`:''}`;return total;};
 window.printFutureBookingDraft=function(){
  const val=id=>document.getElementById(id)?.value||'';
  const items=[];document.querySelectorAll('#fb_lines .booking-line').forEach(r=>{const sku=r.querySelector('.fb_product')?.value||'';if(!sku)return;const p=(db.products||[]).find(x=>sameText(x.sku,sku));if(!p)return;const qty=Number(r.querySelector('.fb_qty')?.value||0),rate=Number(r.querySelector('.fb_rate')?.value||0);items.push({name:p.name,sku:p.sku,qty,rate,total:qty*rate});});
  if(!items.length)return notify('Select at least one product before printing.');
  const total=items.reduce((a,x)=>a+x.total,0),advance=Math.max(0,Number(val('fb_advance')||0)),due=Math.max(0,total-advance);
  const html=bookingPrintHtml({bookingNo:'Draft / Not yet saved',date:val('fb_date'),expected:val('fb_expected'),customer:val('fb_name'),phone:val('fb_phone'),address:val('fb_address'),type:val('fb_type')==='retail'?'Retail Customer':'Existing Dealer',notes:val('fb_notes'),items,total,advance,due});
  const w=window.open('','_blank','width=900,height=700');if(!w)return notify('Please allow pop-ups to print the booking.');w.document.open();w.document.write(html);w.document.close();w.focus();setTimeout(()=>w.print(),350);
 };
 window.bookingPrintHtml=function(b){const rows=(b.items||[]).map(x=>`<tr><td>${esc(x.name||'')}</td><td>${esc(x.sku||'')}</td><td class="num">${Number(x.qty||0)}</td><td class="num">${money(x.rate)}</td><td class="num">${money(x.total??x.line_total??Number(x.qty||0)*Number(x.rate||0))}</td></tr>`).join('');return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Future Delivery Booking</title><style>body{font-family:Arial,sans-serif;color:#182230;margin:28px}h1{margin:0;font-size:24px}h2{font-size:18px;margin:4px 0 18px;color:#536273}.brand{border-bottom:2px solid #182230;padding-bottom:14px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;margin:18px 0}.meta div{padding:5px 0}.label{color:#687588;font-size:12px;display:block;margin-bottom:3px}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{border:1px solid #ccd3dc;padding:9px;text-align:left;font-size:13px}th{background:#f1f4f7}.num{text-align:right}.totals{margin:20px 0 0 auto;width:320px}.totals div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e1e6ec}.totals .due{font-size:17px;font-weight:bold;border-top:2px solid #182230}.notes{margin-top:18px;color:#536273}.sign{display:flex;justify-content:space-between;margin-top:60px;color:#536273;font-size:12px}@media print{body{margin:12mm}button{display:none}}</style></head><body><div class="brand"><h1>Purvanchal Traders</h1><h2>Future Delivery Booking ${esc(b.bookingNo||'')}</h2></div><div class="meta"><div><span class="label">Customer</span><b>${esc(b.customer||'—')}</b></div><div><span class="label">Mobile</span>${esc(b.phone||'—')}</div><div><span class="label">Customer Type</span>${esc(b.type||'—')}</div><div><span class="label">Booking Date</span>${esc(b.date||'—')}</div><div><span class="label">Expected Delivery</span>${esc(b.expected||'—')}</div><div><span class="label">Delivery Address</span>${esc(b.address||'—')}</div></div><table><thead><tr><th>Product</th><th>SKU</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead><tbody>${rows}</tbody></table><div class="totals"><div><span>Total Amount</span><b>${money(b.total||0)}</b></div><div><span>Amount Deposited (Advance)</span><b>${money(b.advance||0)}</b></div><div class="due"><span>Debit / Amount Due</span><b>${Number(b.total||0)>Number(b.advance||0)?'− '+money(Number(b.total)-Number(b.advance)):'₹0.00'}</b></div>${Number(b.advance||0)>Number(b.total||0)?`<div><span>Credit / Excess Advance</span><b>+ ${money(Number(b.advance)-Number(b.total))}</b></div>`:''}</div>${b.notes?`<div class="notes"><b>Notes:</b> ${esc(b.notes)}</div>`:''}<div class="sign"><span>Customer Signature: __________________</span><span>Authorised Signature: __________________</span></div></body></html>`;};
 window.printFutureBooking=function(id){const b=(db.futureBookings||[]).find(x=>String(x.dbId)===String(id));if(!b)return;const items=(b.items||[]).map(x=>({...x,total:x.line_total??Number(x.qty||0)*Number(x.rate||0)}));const w=window.open('','_blank','width=900,height=700');if(!w)return notify('Please allow pop-ups to print the booking.');w.document.open();w.document.write(bookingPrintHtml({bookingNo:b.bookingNo,date:b.date,expected:b.expectedDate,customer:b.customerName,phone:b.phone,address:b.address,type:b.customerType==='retail'?'Retail Customer':'Existing Dealer',notes:b.notes,items,total:Number(b.total||0),advance:Number(b.advance||0),due:Math.max(0,Number(b.total||0)-Number(b.advance||0))}));w.document.close();w.focus();setTimeout(()=>w.print(),350);};
 window.saveFutureBooking=async function(){
  if(!cloudReady)return notify('Please sign in to Supabase first.');
  const customerType=isRetail()?'retail':(document.getElementById('fb_type')?.value||'retail'),dealerDbId=customerType==='dealer'?(document.getElementById('fb_dealer')?.value||null):null;
  const customerName=document.getElementById('fb_name')?.value.trim()||'',phone=document.getElementById('fb_phone')?.value.trim()||'',address=document.getElementById('fb_address')?.value.trim()||'',date=document.getElementById('fb_date')?.value||todayLocal(),expected=document.getElementById('fb_expected')?.value||'',advance=Number(document.getElementById('fb_advance')?.value||0),notes=document.getElementById('fb_notes')?.value.trim()||'';
  if(customerType==='dealer'&&!dealerDbId)return notify('Select an existing dealer, or choose Retail Customer if no dealer account should be created.');
  if(!customerName)return notify('Enter customer name.');if(!phone)return notify('Enter customer mobile number.');if(!address)return notify('Enter delivery address.');if(!expected)return notify('Choose expected delivery date.');if(advance<0)return notify('Advance cannot be negative.');
  const items=[];for(const r of document.querySelectorAll('#fb_lines .booking-line')){const sku=r.querySelector('.fb_product')?.value||'',qty=Number(r.querySelector('.fb_qty')?.value||0),rate=Number(r.querySelector('.fb_rate')?.value||0);if(!sku)continue;if(!Number.isInteger(qty)||qty<=0)return notify('Product quantities must be whole numbers greater than zero.');if(rate<0)return notify('Rate cannot be negative.');const p=db.products.find(x=>sameText(x.sku,sku));if(!p)return notify('Select a valid product.');items.push({sku:p.sku,product_id:p.dbId||null,name:p.name,brand:p.brand||'',category:p.category||'',qty,rate,line_total:qty*rate});}
  if(!items.length)return notify('Add at least one product.');const total=items.reduce((a,x)=>a+x.line_total,0);
  const bookingNo='FDB-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+String(Date.now()).slice(-6);
  const payload={booking_no:bookingNo,customer_type:customerType,customer_name:customerName,customer_phone:phone,customer_address:address,dealer_id:dealerDbId,booking_date:date,expected_delivery_date:expected,items,total_amount:total,advance_amount:advance,status:'Booked',notes,created_by:user?.id||null};
  try{const {error}=await sb.from('future_delivery_bookings').insert(payload);if(error)throw error;await loadCloudData((await sb.auth.getSession()).data.session);closeModal();render();notify('Future-delivery booking '+bookingNo+' saved successfully.');}catch(e){console.error(e);notify('Could not save booking: '+(e?.message||String(e))+' — ensure the V64.43 SQL migration has been run.');}
 };
 window.viewFutureBooking=function(id){const b=(db.futureBookings||[]).find(x=>String(x.dbId)===String(id));if(!b)return;const total=Number(b.total||0),advance=Number(b.advance||0),balance=total-advance,statusOpts=['Booked','Ready for Delivery','Delivered','Cancelled'].map(x=>`<option ${b.status===x?'selected':''}>${x}</option>`).join('');openModal(`<div class="modalhead"><h2>Future Booking ${esc(b.bookingNo||'')}</h2><button class="close" onclick="closeModal()">Close</button></div><div class="notice"><b>Customer:</b> ${esc(b.customerName)} · ${esc(b.phone)}<br><b>Type:</b> ${b.customerType==='retail'?'Retail customer (no ledger)':'Existing dealer'}<br><b>Address:</b> ${esc(b.address)}<br><b>Booked on:</b> ${esc(b.date||'')} · <b>Expected delivery:</b> ${esc(b.expectedDate||'')}<br><b>Status:</b> ${esc(b.status||'Booked')}</div><div class="section" style="margin-top:12px;padding:12px"><div class="sectionhead"><h3 style="margin:0">Edit Booked Products</h3><div class="spacer"></div><button class="btn secondary" onclick="addFutureBookingEditLine()">＋ Add Product</button></div><div id="fb_edit_lines" class="booking-lines"></div><div id="fb_edit_totals" class="notice" style="margin:12px 0 0"></div></div><div class="formgrid" style="margin-top:12px"><div class="field"><label>Update Booking Status</label><select id="fb_status_update">${statusOpts}</select></div><div class="field"><label>Expected Delivery Date</label><input id="fb_expected_update" type="date" value="${esc(b.expectedDate||'')}"></div><div class="field"><label>Advance Deposited (₹)</label><input id="fb_advance_update" type="number" min="0" step="0.01" value="${advance}" oninput="recalcFutureBookingEdit()"></div></div><div id="fb_edit_credit_preview" class="notice" style="margin-top:10px"></div>${b.notes?'<div class="notice"><b>Notes:</b> '+esc(b.notes)+'</div>':''}<div class="modal-actionbar"><button class="btn secondary mobile-action-btn" onclick="printFutureBooking('${esc(b.dbId)}')">Print Booking</button><button class="btn mobile-action-btn" onclick="updateFutureBooking('${esc(b.dbId)}')">Save Booking Changes</button></div>`);(b.items||[]).forEach(x=>addFutureBookingEditLine(x.sku,x.qty,x.rate,x.name));recalcFutureBookingEdit();};
 window.addFutureBookingEditLine=function(sku='',qty=1,rate=null,oldName=''){const root=document.getElementById('fb_edit_lines');if(!root)return;const p=sku?(db.products||[]).find(x=>sameText(x.sku,sku)):null;const line=document.createElement('div');line.className='booking-line';line.innerHTML=`<div class="booking-product" style="position:relative"><input class="fb_product_search" type="text" autocomplete="off" placeholder="Type model / product name or SKU…" value="${p?esc(futureBookingProductLabel(p)):esc(oldName||'') }" oninput="futureBookingProductSearch(this)" onfocus="futureBookingProductSearch(this)" aria-label="Search and select product"><div class="fb_product_results" role="listbox" style="display:none;position:absolute;left:0;right:0;top:100%;z-index:30;max-height:220px;overflow:auto;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 8px 20px #0002"></div><select class="fb_product" onchange="recalcFutureBookingEdit()" style="display:none" aria-hidden="true"><option value="">Select product</option>${(db.products||[]).map(x=>`<option value="${esc(x.sku)}" ${p&&sameText(x.sku,p.sku)?'selected':''}>${esc(x.name)} · ${esc(x.sku)}</option>`).join('')}</select></div><div><label class="muted">Quantity</label><input class="fb_qty" type="number" min="1" step="1" value="${Number(qty||1)}" oninput="recalcFutureBookingEdit()"></div><div><label class="muted">Rate (₹)</label><input class="fb_rate" type="number" min="0" step="0.01" value="${rate===null?(p?futureBookingDefaultRate(p):0):Number(rate||0)}" oninput="recalcFutureBookingEdit()"></div><div class="booking-line-total">₹0 <button class="btn small red booking-remove" type="button" onclick="this.closest('.booking-line').remove();recalcFutureBookingEdit()">Remove</button></div>`;root.appendChild(line);if(p)line.querySelector('.fb_product').value=p.sku;recalcFutureBookingEdit();};
 window.recalcFutureBookingEdit=function(){let total=0;document.querySelectorAll('#fb_edit_lines .booking-line').forEach(r=>{const qty=Math.max(0,Number(r.querySelector('.fb_qty')?.value||0)),rate=Math.max(0,Number(r.querySelector('.fb_rate')?.value||0)),amt=qty*rate;total+=amt;const cell=r.querySelector('.booking-line-total');if(cell)cell.firstChild.textContent=money(amt)+' ';});const advance=Math.max(0,Number(document.getElementById('fb_advance_update')?.value||0)),balance=total-advance,box=document.getElementById('fb_edit_totals'),credit=document.getElementById('fb_edit_credit_preview');if(box)box.innerHTML=`<b>Total Order Value: ${money(total)}</b>`;if(credit)credit.innerHTML=balance>0?`<b>Debit / Amount Due: − ${money(balance)}</b>`:balance<0?`<b>Credit / Excess Advance: + ${money(Math.abs(balance))}</b>`:'<b>Settled: ₹0.00</b>';return total;};
 window.previewFutureBookingAdvance=function(total){const a=Math.max(0,Number(document.getElementById('fb_advance_update')?.value||0)),el=document.getElementById('fb_advance_preview');if(el){const balance=Number(total||0)-a;el.textContent=balance>0?'Debit / Amount Due: − '+money(balance):balance<0?'Credit / Excess Advance: + '+money(Math.abs(balance)):'Settled: ₹0.00';}};
 window.saveFutureBookingAdvance=async function(id){return window.updateFutureBooking(id);};
 window.updateFutureBooking=async function(id){if(!cloudReady)return notify('Please sign in to Supabase first.');const status=document.getElementById('fb_status_update')?.value||'Booked',expected=document.getElementById('fb_expected_update')?.value||'',advance=Number(document.getElementById('fb_advance_update')?.value||0);if(!expected)return notify('Expected delivery date is required.');if(!Number.isFinite(advance)||advance<0)return notify('Advance must be zero or a positive amount.');const items=[];for(const r of document.querySelectorAll('#fb_edit_lines .booking-line')){const sku=r.querySelector('.fb_product')?.value||'',qty=Number(r.querySelector('.fb_qty')?.value||0),rate=Number(r.querySelector('.fb_rate')?.value||0);if(!sku)return notify('Select a valid product for every product line.');if(!Number.isInteger(qty)||qty<=0)return notify('Product quantities must be whole numbers greater than zero.');if(!Number.isFinite(rate)||rate<0)return notify('Rate cannot be negative.');const p=(db.products||[]).find(x=>sameText(x.sku,sku));if(!p)return notify('Selected product was not found.');items.push({sku:p.sku,product_id:p.dbId||null,name:p.name,brand:p.brand||'',category:p.category||'',qty,rate,line_total:qty*rate});}if(!items.length)return notify('Add at least one product.');const total=items.reduce((a,x)=>a+x.line_total,0);try{const {error}=await sb.from('future_delivery_bookings').update({status,expected_delivery_date:expected,items,total_amount:total,advance_amount:advance,updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;await loadCloudData((await sb.auth.getSession()).data.session);closeModal();render();notify('Booking products, quantities, total and advance saved successfully.');}catch(e){console.error(e);notify('Could not save booking changes: '+(e?.message||String(e))+' — check that the V64.48 SQL migration has been run.');}};
})();
